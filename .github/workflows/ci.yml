name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Unit + API tests on embedded Postgres (PGlite)
        run: npm test
      - name: API tests on real PostgreSQL 16
        run: npm test -w @gdc/api
        env: { TEST_PG_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/postgres" }
      - name: Production bundle builds
        run: npm run build -w @gdc/api
      - name: Admin builds
        run: npm run build -w @gdc/admin
      - name: Mobile bundles (Hermes, Android)
        run: cd apps/mobile && EXPO_OFFLINE=1 CI=1 npx expo export --platform android --output-dir /tmp/mobile-export
      - name: Dependency audit (production deps; Expo/Metro build-tooling advisories are triaged in docs/SECURITY.md)
        run: npm audit --omit=dev --workspace @gdc/api
