# Local development stack: docker compose -f infrastructure/docker/docker-compose.yml up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tablya
      POSTGRES_PASSWORD: tablya_dev
      POSTGRES_DB: tablya
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablya"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://tablya:tablya_dev@db:5432/tablya
      JWT_ACCESS_SECRET: dev-only-secret-dev-only-secret-dev-only-1234
      DATA_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PAYMENT_WEBHOOK_SECRET: dev-only-webhook-secret
      PAYMENT_PROVIDER: sandbox
      MESSAGE_PROVIDER: console
      EXPOSE_DEV_OTP: "true"
      STORAGE_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["3000:3000"]
volumes:
  dbdata:
  uploads:
