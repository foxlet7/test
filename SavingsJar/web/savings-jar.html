<title>Savings Jar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; home = total + grid of jars, detail = one big jar, sheets slide up from the bottom. */
:root {
  --bg: #EDF1F7;
  --surface: #FFFFFF;
  --surface-2: #E2E8F1;
  --ink: #14213D;
  --muted: #5A6780;
  --line: rgba(20, 33, 61, .10);
  --gold: #F2A91B;
  --gold-deep: #C9840A;
  --accent: #2F6FE4;
  --on-accent: #FFFFFF;
  --danger: #CF3F3F;
  --good: #1B8A55;
  --scrim: rgba(10, 16, 30, .42);
  --shadow: 0 1px 2px rgba(20, 33, 61, .06), 0 6px 20px rgba(20, 33, 61, .06);
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1322; --surface: #162036; --surface-2: #212C46; --ink: #E9EFF9; --muted: #95A2BA;
    --line: rgba(233, 239, 249, .10); --gold: #F5B83A; --gold-deep: #D99A1E; --accent: #5C8EF5; --on-accent: #0C1322;
    --danger: #F07474; --good: #4CC98A; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1322; --surface: #162036; --surface-2: #212C46; --ink: #E9EFF9; --muted: #95A2BA;
  --line: rgba(233, 239, 249, .10); --gold: #F5B83A; --gold-deep: #D99A1E; --accent: #5C8EF5; --on-accent: #0C1322;
  --danger: #F07474; --good: #4CC98A; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 560px; margin: 0 auto; padding-block: 12px 48px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.01em; }
.brand-coin { width: 26px; height: 26px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; color: var(--ink);
}
.icon-btn svg { width: 20px; height: 20px; }

/* Total */
.total { background: var(--surface); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 6px; }
.label { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.total-amount { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1.05; letter-spacing: -.02em; }
.total-sub { color: var(--muted); font-size: .92rem; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--gold); transition: width .6s ease; }

/* Grid of jars */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.card {
  background: var(--surface); border: 0; border-radius: 22px; padding: 14px; text-align: left; box-shadow: var(--shadow);
  display: grid; gap: 6px; min-width: 0; position: relative; transition: transform .15s ease;
}
.card:active { transform: scale(.97); }
.card-jar { position: relative; height: 128px; display: grid; place-items: center; }
.card-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-money { font-size: .88rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-money b { color: var(--ink); font-weight: 600; }
.card .bar { height: 6px; }
.badge {
  position: absolute; top: 10px; right: 10px; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 99px; background: var(--gold); color: #3A2600;
}
.card-new {
  border: 2px dashed var(--line); background: transparent; box-shadow: none; display: grid; place-items: center; gap: 8px;
  color: var(--muted); font-weight: 600; min-height: 220px; text-align: center;
}
.card-new .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.6rem; color: var(--ink); box-shadow: var(--shadow); }

/* Jar drawing */
.jar-wrap { position: relative; height: 100%; aspect-ratio: 100 / 130; max-width: 100%; }
.card-jar .jar-wrap { height: 128px; }
.hero .jar-wrap { height: 270px; }
.preview .jar-wrap { height: 130px; }
.jar { width: 100%; height: 100%; display: block; overflow: visible; }
.jar-emoji { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%); font-size: 2rem; line-height: 1; pointer-events: none; }
.liq { transition: transform 1s cubic-bezier(.3, 1.35, .5, 1); }
.wave { animation: slosh 3.4s linear infinite; }
.w2 { animation-duration: 2.4s; animation-direction: reverse; }
@keyframes slosh { to { transform: translateX(-50px); } }

/* Empty state */
.empty { text-align: center; padding: 28px 20px 12px; display: grid; justify-items: center; gap: 12px; }
.empty .jar-wrap { height: 150px; }
.empty h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 6px 0 0; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0; max-width: 34ch; }
.empty .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }

/* Buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px 18px;
  font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
  transition: transform .12s ease, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--jar, var(--accent)); border-color: transparent; color: var(--jar-on, var(--on-accent)); }
.btn.danger { color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }

/* Detail */
.topbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-block: 6px 4px; }
.back { border: 0; background: transparent; color: var(--jar-text, var(--accent)); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; padding: 8px 4px; font-size: 1rem; }
.back svg { width: 20px; height: 20px; }
.tb-title { text-align: center; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero { position: relative; height: 270px; display: grid; place-items: center; margin-top: 4px; }
.hero .jar-emoji { font-size: 3.4rem; }
.coin {
  position: absolute; left: 50%; top: 0; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #FFE7A3, var(--gold) 55%, var(--gold-deep));
  box-shadow: inset 0 0 0 3px rgba(150, 95, 0, .35), inset 0 0 0 8px rgba(255, 255, 255, .18);
}
.coin.drop { animation: drop .7s cubic-bezier(.5, 0, .9, .5) forwards; }
@keyframes drop {
  0% { transform: translateY(-30px) rotateY(0) scale(1); opacity: 1; }
  75% { opacity: 1; }
  100% { transform: translateY(150px) rotateY(540deg) scale(.6); opacity: 0; }
}
.figures { text-align: center; display: grid; gap: 2px; margin-top: 8px; }
.big-amount { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1.05; letter-spacing: -.02em; }
.of { color: var(--muted); font-weight: 600; }
.pace { font-size: .92rem; color: var(--muted); margin-top: 6px; text-wrap: balance; }
.pace.done { color: var(--jar-text, var(--accent)); font-weight: 700; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
.chip {
  border: 0; border-radius: 14px; min-height: 46px; font-weight: 700; padding: 8px 4px;
  background: var(--jar-soft, var(--surface-2)); color: var(--jar-text, var(--ink));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .12s ease;
}
.chip:active { transform: scale(.94); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.section-title { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; margin: 28px 0 10px; }
.history { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.history li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto 32px; align-items: center; gap: 12px; padding: 12px 10px 12px 14px; }
.history li + li { border-top: 1px solid var(--line); }
.h-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--jar-soft, var(--surface-2)); color: var(--jar-text, var(--accent)); }
.h-icon.out { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.h-icon svg { width: 18px; height: 18px; }
.h-note { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-date { font-size: .8rem; color: var(--muted); }
.h-amt { font-weight: 700; }
.h-amt.out { color: var(--danger); }
.h-del { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.h-del svg { width: 16px; height: 16px; }
.history .none { display: block; color: var(--muted); padding: 18px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: rise .28s cubic-bezier(.2, .9, .3, 1);
}
.grabber { width: 40px; height: 5px; border-radius: 99px; background: var(--surface-2); margin: 0 auto 10px; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 14px; }
.sheet-head h2 { margin: 0; font-size: 1.05rem; text-align: center; }
.sheet-head .left { justify-self: start; }
.sheet-head .right { justify-self: end; }
.link-btn { border: 0; background: transparent; color: var(--jar-text, var(--accent)); font-weight: 700; padding: 8px 4px; }
.link-btn:disabled { opacity: .35; cursor: not-allowed; }
@keyframes rise { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > label, .field > .label { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.input {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 14px; min-height: 48px; font-size: 16px;
}
.money-input { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 6px 16px; }
.money-input span { font-family: var(--font-display); font-size: 1.8rem; color: var(--muted); font-weight: 600; }
.money-input input { border: 0; background: transparent; width: 100%; min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; padding: 4px 0; outline: none; }
.money-input:focus-within { border-color: var(--jar, var(--accent)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--jar, var(--accent)) 25%, transparent); }
.hint { font-size: .85rem; color: var(--muted); }
.hint.err { color: var(--danger); font-weight: 600; }
.emoji-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.emoji-grid button { aspect-ratio: 1; border: 0; border-radius: 12px; background: transparent; font-size: 1.45rem; padding: 0; }
.emoji-grid button[aria-pressed="true"] { background: var(--jar-soft, var(--surface-2)); box-shadow: inset 0 0 0 2px var(--jar, var(--accent)); }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.swatches button { width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-2); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + i { background: var(--jar, var(--accent)); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
.preview { height: 130px; display: grid; place-items: center; margin-bottom: 8px; }
.danger-zone { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 16px; display: grid; gap: 10px; }
.confirm-box { background: color-mix(in srgb, var(--danger) 10%, transparent); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.confirm-box p { margin: 0; }
.confirm-box .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Toast, status, confetti */
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); animation: fade .2s ease;
}
.toast button { border: 0; background: transparent; color: var(--gold); font-weight: 800; padding: 6px 8px; }
.status { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 28px; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

/* Tabs and spending */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; margin-bottom: 16px; }
.tabs button { border: 0; background: transparent; border-radius: 10px; min-height: 40px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.months { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.months::-webkit-scrollbar { display: none; }
.mchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 600; }
.mchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.inout { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: .92rem; }
.inout b { color: var(--ink); }
.pos { color: var(--good) !important; }
.neg { color: var(--danger) !important; }
.notice { background: color-mix(in srgb, var(--gold) 20%, var(--surface)); border-radius: 14px; padding: 8px 8px 8px 14px; margin-bottom: 14px; font-size: .92rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px; }
.notice .link-btn { color: var(--ink); text-decoration: underline; }
.ideas { display: grid; gap: 10px; }
.idea { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.idea h3 { margin: 0; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.idea p { margin: 0; color: var(--muted); font-size: .92rem; }
.idea .btn { justify-self: start; min-height: 40px; padding: 8px 14px; font-size: .92rem; }
.cats, .txs { list-style: none; margin: 0; padding: 0; }
.cats { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.cats > li + li { border-top: 1px solid var(--line); }
.cat-row { width: 100%; border: 0; background: transparent; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; grid-template-areas: "dot name amt" "bar bar bar"; align-items: center; gap: 8px 10px; padding: 14px 16px; text-align: left; }
.cat-row[aria-expanded="true"] { background: var(--surface-2); }
.dot { grid-area: dot; width: 12px; height: 12px; border-radius: 50%; }
.cat-name { grid-area: name; font-weight: 600; }
.cat-amt { grid-area: amt; font-weight: 700; }
.cat-bar { grid-area: bar; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cat-bar i { display: block; height: 100%; border-radius: inherit; }
.txs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 16px; border-top: 1px solid var(--line); align-items: center; }
.tx-desc { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-date { display: block; font-size: .8rem; color: var(--muted); }
.tx-amt { font-weight: 700; }
.tx-cat { grid-column: 1 / -1; justify-self: start; max-width: 100%; font-size: .85rem; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; }
.subs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 12px 16px; align-items: center; }
.subs .subs-total { color: var(--muted); font-weight: 600; }
.spend-actions { display: grid; gap: 10px; margin-top: 24px; }
.steps { margin: 0 0 16px; padding-left: 1.3em; display: grid; gap: 6px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.file-btn { width: 100%; }
.file-btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.preview-sum { display: grid; gap: 4px; margin-bottom: 14px; }
.preview-sum p { margin: 4px 0 0; }
.ps-big { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.ps-file { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.sheet .txs { background: var(--bg); border-radius: 14px; overflow: hidden; margin-top: 6px; }
.sheet .txs li:first-child { border-top: 0; }
.money-input.small input { font-size: 1.5rem; }
.money-input.small span { font-size: 1.25rem; }
.jar-pick { display: grid; gap: 8px; margin-top: 12px; }
.pick { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 8px 12px; }
.pick-jar { height: 58px; display: grid; place-items: center; }
.pick-jar .jar-wrap { height: 58px; }
.pick-jar .jar-emoji { font-size: 1rem; }
.pick-text { display: grid; min-width: 0; }
.pick-text b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-grid { display: grid; }

.verdict { border-radius: 16px; padding: 14px; display: grid; gap: 8px; margin-bottom: 14px; }
.verdict.ok { background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.verdict.bad { background: color-mix(in srgb, var(--danger) 11%, var(--surface)); }
.verdict p { margin: 0; }
.v-head { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; }
.v-head > div { display: grid; min-width: 0; }
.v-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .92rem; }
.v-checks li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: center; }
.checking { display: flex; align-items: center; gap: 12px; padding: 18px 4px; min-width: 0; overflow-wrap: anywhere; }
.spinner { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 360px) {
  .grid { gap: 10px; }
  .card-jar, .card-jar .jar-wrap { height: 110px; }
  .big-amount { font-size: 2.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  .wave, .coin.drop, .sheet, .scrim, .toast { animation: none !important; }
  .spinner { animation-duration: 2.4s; }
  .liq, .bar > i { transition: none; }
}
</style>

<div class="app">
  <!-- Home -->
  <section id="home">
    <header class="head">
      <div class="brand">
        <svg class="brand-coin" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="var(--gold)"/><circle cx="13" cy="13" r="7.5" fill="none" stroke="var(--gold-deep)" stroke-width="2"/></svg>
        Savings Jar
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" data-tab="jars" aria-selected="true">Jars</button>
      <button role="tab" data-tab="spend" aria-selected="false">Spending</button>
    </div>
    <div id="homeBody"></div>
  </section>

  <!-- One jar -->
  <section id="detail" hidden></section>

  <p class="status" id="status">Loading your jars…</p>
</div>
<canvas id="confetti" hidden></canvas>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
  "use strict";

  // ---------- constants ----------
  const COLORS = {
    ocean:  { c: "#338CF2", on: "#FFFFFF", name: "Ocean" },
    mint:   { c: "#24B48F", on: "#FFFFFF", name: "Mint" },
    sunset: { c: "#FF8A3D", on: "#FFFFFF", name: "Sunset" },
    berry:  { c: "#E9487D", on: "#FFFFFF", name: "Berry" },
    lemon:  { c: "#F2B81F", on: "#3A2A00", name: "Lemon" },
    grape:  { c: "#8F66EB", on: "#FFFFFF", name: "Grape" },
  };
  const EMOJIS = ["✈️","🏖️","🏠","🚗","🚲","💻","📱","🎮","🎸","📷","🎓","💍","🎁","🐶","👶","💰"];
  const QUICK = [5, 10, 20, 50];
  const CURRENCIES = ["USD","EUR","GBP","CAD","AUD","NZD","JPY","CHF","SEK","NOK","DKK","PLN","INR","SGD","HKD","CNY","KRW","BRL","MXN","ZAR","TRY","AED","SAR","QAR","KWD","BHD","OMR","JOD","EGP","MAD","NGN","KES","PHP","IDR","MYR","THB"];
  const REGION_CURRENCY = {
    US:"USD", GB:"GBP", CA:"CAD", AU:"AUD", NZ:"NZD", JP:"JPY", CH:"CHF", SE:"SEK", NO:"NOK", DK:"DKK", PL:"PLN", IN:"INR",
    SG:"SGD", HK:"HKD", CN:"CNY", KR:"KRW", BR:"BRL", MX:"MXN", ZA:"ZAR", TR:"TRY", AE:"AED", SA:"SAR", QA:"QAR", KW:"KWD",
    BH:"BHD", OM:"OMR", JO:"JOD", EG:"EGP", MA:"MAD", NG:"NGN", KE:"KES", PH:"PHP", ID:"IDR", MY:"MYR", TH:"THB",
    DE:"EUR", FR:"EUR", ES:"EUR", IT:"EUR", NL:"EUR", BE:"EUR", AT:"EUR", IE:"EUR", PT:"EUR", FI:"EUR", GR:"EUR", SK:"EUR", SI:"EUR", LU:"EUR", EE:"EUR", LV:"EUR", LT:"EUR", HR:"EUR", CY:"EUR", MT:"EUR",
  };
  const BODY = "M20 15 H80 V21 Q96 21 96 37 V108 Q96 128 76 128 H24 Q4 128 4 108 V37 Q4 21 20 21 Z";
  const WAVE = (() => {
    let d = "M-50 0";
    for (let x = -50; x <= 250; x += 5) d += ` L${x} ${(3 * Math.sin((2 * Math.PI * x) / 50)).toFixed(2)}`;
    return d + " L250 160 L-50 160 Z";
  })();
  const ICON = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    in: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
    out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  };

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const isoToDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };

  function guessCurrency() {
    try {
      const loc = new Intl.Locale(navigator.language || "en-US").maximize();
      return REGION_CURRENCY[loc.region] || "USD";
    } catch { return "USD"; }
  }
  const fmtCache = {};
  function fmt(v, short = false) {
    const key = state.currency + (short ? "s" : "");
    if (!fmtCache[key]) {
      try {
        fmtCache[key] = new Intl.NumberFormat(undefined, short
          ? { style: "currency", currency: state.currency, maximumFractionDigits: 0 }
          : { style: "currency", currency: state.currency });
      } catch { fmtCache[key] = new Intl.NumberFormat(undefined, { maximumFractionDigits: short ? 0 : 2 }); }
    }
    return fmtCache[key].format(v);
  }
  function currencySymbol() {
    try {
      const p = new Intl.NumberFormat(undefined, { style: "currency", currency: state.currency }).formatToParts(0);
      return (p.find((x) => x.type === "currency") || {}).value || state.currency;
    } catch { return state.currency; }
  }
  function fractionDigits() {
    try { return new Intl.NumberFormat("en", { style: "currency", currency: state.currency }).resolvedOptions().maximumFractionDigits; }
    catch { return 2; }
  }
  const DECIMAL = (1.5).toLocaleString().replace(/\d/g, "") || ".";
  /** Parses what was typed ("12.50", "12,50", "1,200"). Null for empty, invalid or non-positive input. */
  function parseAmount(text) {
    let s = String(text).replace(/[^\d.,]/g, "");
    if (!s) return null;
    if (DECIMAL === ",") s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
    const v = Number(s);
    if (!isFinite(v) || v <= 0) return null;
    const f = Math.pow(10, fractionDigits());
    return Math.round(v * f) / f;
  }
  const plain = (v) => v.toLocaleString(undefined, { useGrouping: false, maximumFractionDigits: 3 });

  // ---------- model ----------
  let state = { v: 1, currency: guessCurrency(), jars: [] };
  let openJarId = null;
  let spend = { v: 1, tx: [], rules: {}, sample: false };
  let tab = "jars";

  const saved = (jar) => jar.deposits.reduce((s, d) => s + d.amount, 0);
  const progress = (jar) => jar.goal > 0 ? Math.min(Math.max(saved(jar) / jar.goal, 0), 1) : 0;
  const isComplete = (jar) => jar.goal > 0 && saved(jar) >= jar.goal - 1e-9;
  const jarById = (id) => state.jars.find((j) => j.id === id);
  const colorOf = (jar) => COLORS[jar.color] || COLORS.ocean;

  const monthLabel = (iso) => isoToDate(iso).toLocaleDateString(undefined, { month: "short", year: "numeric" });
  function addMonths(n) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + Math.ceil(n)); return d.toISOString().slice(0, 10); }

  /** One line under the big number: how the jar is doing against its date and monthly plan. */
  function pace(jar) {
    if (isComplete(jar)) return { text: "Goal reached! Nicely done.", done: true };
    const remaining = Math.max(jar.goal - saved(jar), 0);
    const plan = jar.plan > 0 ? jar.plan : 0;
    let days = null;
    if (jar.deadline) days = Math.round((isoToDate(jar.deadline) - isoToDate(todayISO())) / 86400000);
    if (days !== null && days <= 0) return { text: `Target date passed · ${fmt(remaining)} to go` };
    if (days !== null) {
      const months = Math.max(days / 30.44, 1 / 4.35);
      const perMonth = remaining / months;
      const when = isoToDate(jar.deadline).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      if (plan) {
        return plan + 0.005 >= perMonth
          ? { text: `On track: ${fmt(plan, true)} a month gets you there by ${monthLabel(addMonths(remaining / plan))}`, good: true }
          : { text: `${fmt(plan, true)} a month isn't enough for ${when}. You'd need ${fmt(Math.ceil(perMonth), true)} a month.` };
      }
      return { text: `Save ${fmt(remaining / Math.max(days / 7, 1))} a week (${fmt(Math.ceil(perMonth), true)} a month) to reach it by ${when}` };
    }
    if (plan) return { text: `At ${fmt(plan, true)} a month you'll reach it by ${monthLabel(addMonths(remaining / plan))}`, good: true };
    return null;
  }

  function normalize(raw) {
    if (!raw || typeof raw !== "object" || !Array.isArray(raw.jars)) return null;
    const out = { v: 1, currency: typeof raw.currency === "string" ? raw.currency : state.currency, jars: [] };
    for (const j of raw.jars) {
      if (!j || typeof j.id !== "string") continue;
      out.jars.push({
        id: j.id, name: String(j.name || "Jar").slice(0, 60), emoji: String(j.emoji || "💰").slice(0, 8),
        goal: Number(j.goal) > 0 ? Number(j.goal) : 1, color: COLORS[j.color] ? j.color : "ocean",
        createdAt: Number(j.createdAt) || Date.now(), deadline: typeof j.deadline === "string" ? j.deadline : null,
        plan: Number(j.plan) > 0 ? Number(j.plan) : 0,
        deposits: Array.isArray(j.deposits) ? j.deposits.filter((d) => d && isFinite(Number(d.amount))).map((d) => ({
          id: String(d.id || uid()), amount: Number(d.amount), note: String(d.note || "").slice(0, 80),
          date: typeof d.date === "string" ? d.date : todayISO(), at: Number(d.at) || 0,
        })) : [],
      });
    }
    return out;
  }

  // ---------- storage: private db docs when available, browser storage as backup ----------
  // Two documents in the viewer's private subtree: "savings" (jars) and "spending" (imported transactions).
  function makeSync({ localKey, docId, get, put, hasData }) {
    const s = { ref: null, writing: false, dirty: false, confirmed: false };
    s.readLocal = () => { try { const v = localStorage.getItem(localKey); return v ? JSON.parse(v) : null; } catch { return null; } };
    s.writeLocal = () => { try { localStorage.setItem(localKey, JSON.stringify(get())); } catch {} };
    s.attach = (coll, onServer, onError) => {
      s.ref = coll.doc(docId);
      s.ref.onSnapshot((snap) => {
        if (!snap.metadata.fromCache) onServer();
        if (snap.metadata.hasPendingWrites || s.writing || s.dirty) return;
        if (snap.exists) { if (put(clone(snap.data()))) { s.writeLocal(); renderAll(); } }
        else if (!snap.metadata.fromCache && !s.confirmed && hasData()) s.save(); // move browser-only data into the account
        if (!snap.metadata.fromCache) s.confirmed = true;
      }, (e) => { s.ref = null; onError(e); });
    };
    s.save = () => { s.writeLocal(); if (!s.ref) return; s.dirty = true; s.flush(); };
    s.flush = async () => {
      if (s.writing) return;
      s.writing = true;
      let retried = false;
      while (s.dirty) {
        s.dirty = false;
        try { await s.ref.set(clone(get())); retried = false; if (Store.mode !== "cloud") Store.setMode("cloud"); }
        catch (e) {
          if (e && e.code === "unavailable" && !retried) { retried = true; s.dirty = true; await new Promise((r) => setTimeout(r, 600 + Math.random() * 800)); }
          else Store.setMode(e && e.code === "quota_exceeded" ? "full" : "error");
        }
      }
      s.writing = false;
    };
    return s;
  }

  const SavingsSync = makeSync({
    localKey: "savings-jar-v1", docId: "savings", get: () => state, hasData: () => state.jars.length > 0,
    put: (raw) => { const next = normalize(raw); if (!next) return false; state = next; for (const k in fmtCache) delete fmtCache[k]; return true; },
  });
  const SpendSync = makeSync({
    localKey: "savings-jar-spending-v1", docId: "spending", get: () => spend, hasData: () => spend.tx.length > 0,
    put: (raw) => { const next = normalizeSpend(raw); if (!next) return false; spend = next; return true; },
  });

  const Store = {
    mode: "local",
    async init() {
      const c = window.claude;
      if (!c || typeof c.use !== "function") return this.setMode("local");
      let db = null, user = null;
      try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch {}
      let id = null;
      try { id = user ? await user.id() : null; } catch {}
      if (!db || !id) return this.setMode("local");
      let coll;
      try { coll = db.collection("data/users/" + id); } catch { return this.setMode("local"); }
      this.setMode("connecting");
      const timer = setTimeout(() => { if (this.mode === "connecting") this.setMode("slow"); }, 10000);
      const onServer = () => { clearTimeout(timer); if (this.mode === "connecting" || this.mode === "slow") this.setMode("cloud"); };
      const onError = () => { clearTimeout(timer); this.setMode("local"); };
      SavingsSync.attach(coll, onServer, onError);
      SpendSync.attach(coll, onServer, onError);
    },
    setMode(m) {
      this.mode = m;
      $("#status").textContent = {
        local: "Saved in this browser.",
        connecting: "Loading your jars…",
        slow: "Can't reach your saved jars yet. Changes are kept on this device for now.",
        cloud: "Saved to your Claude account. Only you can see your jars and spending.",
        error: "Couldn't save the last change to your account. It's kept on this device.",
        full: "Your saved data is full. Remove older imported statements to keep saving.",
      }[m] || "";
    },
  };

  function commit() { SavingsSync.save(); }
  function commitSpend() {
    // Keep the document well under the store's 256 KB limit: drop the oldest transactions if needed.
    spend.tx.sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
    while (spend.tx.length > 200 && JSON.stringify(spend).length > 220000) spend.tx.splice(-100);
    SpendSync.save();
  }

  // ---------- jar drawing ----------
  let svgSeq = 0;
  function levelY(p) {
    if (p <= 0) return 140;
    const l = Math.max(p, 0.05);
    return l >= 1 ? 9 : 128 - 113 * l;
  }
  function jarSVG(colorKey, p) {
    const n = ++svgSeq;
    const c = (COLORS[colorKey] || COLORS.ocean).c;
    return `<svg class="jar" viewBox="0 0 100 130" aria-hidden="true">
      <defs>
        <clipPath id="jc${n}"><path d="${BODY}"/></clipPath>
        <linearGradient id="jg${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".75"/><stop offset="1" stop-color="${c}"/></linearGradient>
      </defs>
      <rect x="15" y="1" width="70" height="11" rx="4" fill="${c}" fill-opacity=".9"/>
      <path d="${BODY}" fill="${c}" fill-opacity=".1"/>
      <g clip-path="url(#jc${n})">
        <g class="liq" style="transform: translateY(${levelY(p)}px)">
          <path class="wave w1" d="${WAVE}" fill="${c}" fill-opacity=".35"/>
          <g transform="translate(-18 2.5)"><path class="wave w2" d="${WAVE}" fill="url(#jg${n})"/></g>
        </g>
      </g>
      <path d="${BODY}" fill="none" stroke="${c}" stroke-opacity=".6" stroke-width="2.2"/>
      <rect x="12" y="34" width="4" height="38" rx="2" fill="#FFFFFF" fill-opacity=".5"/>
    </svg>`;
  }
  function jarBlock(colorKey, p, emoji) {
    return `<div class="jar-wrap">${jarSVG(colorKey, p)}<span class="jar-emoji">${esc(emoji)}</span></div>`;
  }
  function setJarLevel(root, p) { const g = root.querySelector(".liq"); if (g) g.style.transform = `translateY(${levelY(p)}px)`; }

  function jarVars(el, jar) {
    const col = colorOf(jar);
    el.style.setProperty("--jar", col.c);
    el.style.setProperty("--jar-on", col.on);
    el.style.setProperty("--jar-soft", `color-mix(in srgb, ${col.c} 16%, transparent)`);
    el.style.setProperty("--jar-text", jar.color === "lemon" ? "color-mix(in srgb, #F2B81F 55%, var(--ink))" : col.c);
  }

  // ---------- home ----------
  function renderHome() {
    const body = $("#homeBody");
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    if (tab === "spend") { renderSpending(body); return; }
    if (!state.jars.length) {
      body.innerHTML = `
        <div class="empty">
          <div class="jar-wrap" style="height:150px">${jarSVG("ocean", 0.3)}<span class="jar-emoji" style="font-size:2.2rem">✈️</span></div>
          <h2>What are you saving for?</h2>
          <p>Make a jar for a trip, a laptop or a rainy day, then drop money in as you go and watch it fill.</p>
          <div class="row">
            <button class="btn primary" id="firstJar">Create a jar</button>
            <button class="btn" id="examples">Try example jars</button>
          </div>
        </div>`;
      $("#firstJar").onclick = () => openEditor(null);
      $("#examples").onclick = loadExamples;
      return;
    }
    const total = state.jars.reduce((s, j) => s + saved(j), 0);
    const goal = state.jars.reduce((s, j) => s + j.goal, 0);
    const done = state.jars.filter(isComplete).length;
    const sorted = [...state.jars].sort((a, b) => a.createdAt - b.createdAt);
    body.innerHTML = `
      <div class="total">
        <span class="label">Total saved</span>
        <span class="total-amount num">${esc(fmt(total))}</span>
        <div class="bar" aria-hidden="true"><i style="width:${goal > 0 ? Math.min(total / goal, 1) * 100 : 0}%"></i></div>
        <span class="total-sub num">${esc(fmt(goal, true))} in goals across ${state.jars.length} ${state.jars.length === 1 ? "jar" : "jars"}${done ? ` · ${done} reached` : ""}</span>
      </div>
      <div class="grid">
        ${sorted.map((j) => `
          <button class="card" data-id="${esc(j.id)}" aria-label="${esc(j.name)}, ${esc(fmt(saved(j)))} of ${esc(fmt(j.goal))}">
            ${isComplete(j) ? '<span class="badge">Done</span>' : ""}
            <div class="card-jar">${jarBlock(j.color, progress(j), j.emoji)}</div>
            <span class="card-name">${esc(j.name)}</span>
            <span class="card-money num"><b>${esc(fmt(saved(j), true))}</b> of ${esc(fmt(j.goal, true))}</span>
            <div class="bar" aria-hidden="true"><i style="width:${progress(j) * 100}%;background:${colorOf(j).c}"></i></div>
          </button>`).join("")}
        <button class="card card-new" id="newJar"><span class="plus" aria-hidden="true">+</span>New jar</button>
      </div>`;
    body.querySelectorAll(".card[data-id]").forEach((b) => (b.onclick = () => openJar(b.dataset.id)));
    $("#newJar").onclick = () => openEditor(null);
  }

  // ---------- detail ----------
  let shownAmount = 0;
  function openJar(id) {
    const jar = jarById(id);
    if (!jar) return;
    openJarId = id;
    const el = $("#detail");
    jarVars(el, jar);
    el.innerHTML = `
      <div class="topbar">
        <button class="back" id="back">${ICON.back}Jars</button>
        <div class="tb-title" id="dTitle"></div>
        <button class="icon-btn" id="editJar" aria-label="Edit jar">${ICON.edit}</button>
      </div>
      <div class="hero">
        <div class="jar-wrap" id="bigJar">${jarSVG(jar.color, progress(jar))}<span class="jar-emoji" id="dEmoji"></span></div>
        <div class="coin" id="coin" aria-hidden="true"></div>
      </div>
      <div class="figures">
        <div class="big-amount num" id="dAmount" aria-live="polite"></div>
        <div class="of num" id="dOf"></div>
        <div class="pace" id="dPace"></div>
      </div>
      <div class="quick">${QUICK.map((a) => `<button class="chip num" data-amt="${a}" aria-label="Add ${esc(fmt(a, true))}">+${esc(fmt(a, true))}</button>`).join("")}</div>
      <div class="actions">
        <button class="btn primary" id="addBtn">Add money</button>
        <button class="btn" id="wdBtn">Withdraw</button>
      </div>
      <h2 class="section-title">History</h2>
      <ul class="history" id="history"></ul>`;
    $("#back").onclick = closeJar;
    $("#editJar").onclick = () => openEditor(openJarId);
    $("#addBtn").onclick = () => openMoney("in");
    $("#wdBtn").onclick = () => openMoney("out");
    el.querySelectorAll(".chip").forEach((b) => (b.onclick = () => record(Number(b.dataset.amt))));
    shownAmount = saved(jar);
    $("#home").hidden = true;
    el.hidden = false;
    window.scrollTo(0, 0);
    updateDetail(false);
  }
  function closeJar() {
    openJarId = null;
    $("#detail").hidden = true;
    $("#home").hidden = false;
    renderHome();
    window.scrollTo(0, 0);
  }
  function updateDetail(animate = true) {
    const jar = jarById(openJarId);
    if (!jar) { closeJar(); return; }
    const el = $("#detail");
    jarVars(el, jar);
    $("#dTitle").textContent = jar.name;
    $("#dEmoji").textContent = jar.emoji;
    setJarLevel($("#bigJar"), progress(jar));
    tweenAmount(saved(jar), animate);
    $("#dOf").textContent = `of ${fmt(jar.goal)} · ${Math.round(progress(jar) * 100)}%`;
    const p = pace(jar);
    const paceEl = $("#dPace");

  let tweenRaf = 0;
  function tweenAmount(target, animate) {
    const el = $("#dAmount");
    cancelAnimationFrame(tweenRaf);
    if (!animate || reduceMotion() || Math.abs(target - shownAmount) < 0.005) { shownAmount = target; el.textContent = fmt(target); return; }
    const from = shownAmount, start = performance.now(), dur = 650;
    const step = (t) => {
      const k = Math.min((t - start) / dur, 1), e = 1 - Math.pow(1 - k, 3);
      shownAmount = from + (target - from) * e;
      el.textContent = fmt(shownAmount);
      if (k < 1) tweenRaf = requestAnimationFrame(step); else { shownAmount = target; el.textContent = fmt(target); }
    };
    tweenRaf = requestAnimationFrame(step);
  }
  function renderHistory(jar) {
    const ul = $("#history");
    const items = [...jar.deposits].sort((a, b) => (b.date === a.date ? (b.at || 0) - (a.at || 0) : b.date < a.date ? -1 : 1));
    if (!items.length) { ul.innerHTML = `<li class="none">Nothing in here yet. Tap +${esc(fmt(QUICK[0], true))} to drop in your first coin.</li>`; return; }
    ul.innerHTML = items.map((d) => {
      const out = d.amount < 0;
      const when = isoToDate(d.date).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      return `<li>
        <span class="h-icon${out ? " out" : ""}" aria-hidden="true">${out ? ICON.out : ICON.in}</span>
        <span style="min-width:0"><div class="h-note">${esc(d.note || (out ? "Withdrawal" : "Deposit"))}</div><div class="h-date">${esc(when)}</div></span>
        <span class="h-amt num${out ? " out" : ""}">${out ? "−" : "+"}${esc(fmt(Math.abs(d.amount)))}</span>
        <button class="h-del" data-id="${esc(d.id)}" aria-label="Remove this entry">${ICON.x}</button>
      </li>`;
    }).join("");
    ul.querySelectorAll(".h-del").forEach((b) => (b.onclick = () => removeDeposit(b.dataset.id)));

  // ---------- actions ----------
  function record(amount, note = "", date = todayISO()) {
    const jar = jarById(openJarId);
    if (!jar) return;
    const was = isComplete(jar);
    jar.deposits.push({ id: uid(), amount, note: note.trim().slice(0, 80), date, at: Date.now() });
    commit();
    if (amount > 0) dropCoin();
    if (navigator.vibrate) { try { navigator.vibrate(amount > 0 ? 12 : [8, 40, 8]); } catch {} }
    updateDetail(true);
    if (!was && isComplete(jar)) setTimeout(confetti, 450);
  }
  function removeDeposit(depId) {
    const jar = jarById(openJarId);
    if (!jar) return;
    const idx = jar.deposits.findIndex((d) => d.id === depId);
    if (idx < 0) return;
    const [removed] = jar.deposits.splice(idx, 1);
    commit();
    updateDetail(true);
    const jarId = jar.id;
    toast(`${removed.amount < 0 ? "Withdrawal" : "Deposit"} removed`, () => {
      const j = jarById(jarId);
      if (!j) return;
      j.deposits.push(removed);
      commit();
      if (openJarId === jarId) updateDetail(true);
    });
  }
  function dropCoin() {
    const c = $("#coin");
    if (!c || reduceMotion()) return;
    c.classList.remove("drop");
    void c.offsetWidth;
    c.classList.add("drop");
  }
  function loadExamples() {
    const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
    const mk = (name, emoji, goal, color, deadline, deps) => ({
      id: uid(), name, emoji, goal, color, deadline, createdAt: Date.now() + state.jars.length,
      deposits: deps.map(([amount, note, d]) => ({ id: uid(), amount, note, date: day(d), at: 0 })),
    });
    state.jars.push(
      mk("Trip to Japan", "✈️", 2500, "berry", day(150), [[500, "Bonus", -40], [250, "", -21], [-60, "Rail pass deposit", -10], [100, "Birthday money", -2]]),
      mk("New laptop", "💻", 1200, "ocean", null, [[300, "", -14], [120, "Sold old phone", -3]]),
      mk("Bike", "🚲", 400, "mint", null, [[400, "Saved it all!", -5]]),

    const prevFocus = document.activeElement;

  }

  function openMoney(kind) {
    const jar = jarById(openJarId);
    if (!jar) return;
    const available = saved(jar);
    const isIn = kind === "in";
    openSheet(`
      <div class="sheet-head">
        <button class="link-btn left" data-act="cancel">Cancel</button>
        <h2>${isIn ? "Add money" : "Withdraw"}</h2>
        <button class="link-btn right" data-act="save" disabled>${isIn ? "Add" : "Withdraw"}</button>
      </div>

        <div class="field">
          <label for="amt">Amount</label>
          <div class="money-input"><span>${esc(currencySymbol())}</span><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="amtHint"></div>
          <span class="hint num" id="amtHint">${isIn ? "" : `${esc(fmt(available))} available`}</span>
        </div>
        <div class="field">
          <label for="note">Note</label>
          <input class="input" id="note" maxlength="80" placeholder="${isIn ? "e.g. Birthday money" : "e.g. Concert tickets"}">
        </div>
        <div class="field">
          <label for="when">Date</label>
          <input class="input" id="when" type="date" value="${todayISO()}" max="${todayISO()}">
        </div>
        <button class="btn primary" style="width:100%" type="submit" id="moneySubmit" disabled>${isIn ? "Add to jar" : "Take out of jar"}</button>
      </form>`, (sheet) => {
      const amt = $("#amt", sheet), hint = $("#amtHint", sheet), saveBtn = sheet.querySelector('[data-act="save"]'), submit = $("#moneySubmit", sheet);
      const valid = () => {
        const v = parseAmount(amt.value);
        let ok = v != null;
        if (!isIn) {
          if (v != null && v > available + 1e-9) { ok = false; hint.textContent = `There's only ${fmt(available)} in this jar.`; hint.classList.add("err"); }
          else { hint.textContent = `${fmt(available)} available`; hint.classList.remove("err"); }
        }
        saveBtn.disabled = submit.disabled = !ok;
        return ok ? v : null;
      };
      amt.addEventListener("input", valid);
      const done = (e) => {
        if (e) e.preventDefault();
        const v = valid();
        if (v == null) return;
        const date = $("#when", sheet).value || todayISO();
        const note = $("#note", sheet).value;
        closeSheet();
        record(isIn ? v : -v, note, date > todayISO() ? todayISO() : date);
      };
      $("#moneyForm", sheet).addEventListener("submit", done);
      saveBtn.onclick = done;
      sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
      setTimeout(() => amt.focus(), 60);

    if (/credit card payment|card payment|سداد البطاقة/.test(ty)) return { t: "Credit card payment", c: "own" };
    if (/fee|vat|charge|رسوم|ضريبة/.test(ty)) return { t: type, c: "fees" };

  async function readPDF(file) {
    const lib = await loadPDFJS();
    const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise;
    const out = [];
    let found = false, anyText = false, headText = "";
    for (let n = 1; n <= doc.numPages; n++) {
      const tc = await (await doc.getPage(n)).getTextContent();
      const items = tc.items.filter((it) => it.str && it.str.trim()).map((it) => ({ s: it.str.normalize("NFKC").trim(), x: it.transform[4], y: it.transform[5] }));
      if (items.length) anyText = true;
      if (n === 1) headText = items.map((it) => it.s).join(" ").slice(0, 8000);
      const lines = {};
      for (const it of items) (lines[Math.round(it.y)] = lines[Math.round(it.y)] || []).push(it);
      let head = null;
      for (const [y, row] of Object.entries(lines)) {
        const col = {};
        for (const it of row) for (const [k, re] of Object.entries(PDF_HEAD)) if (col[k] == null && re.test(it.s)) col[k] = it.x;
        if (col.date != null && col.desc != null && (col.debit != null || col.credit != null || col.amount != null)) { head = { y: +y, col }; break; }
      }
      if (!head) continue;
      found = true;
      const cols = Object.entries(head.col).sort((a, b) => a[1] - b[1]);
      const colOf = (x) => { let c = null; for (const [k, cx] of cols) if (x >= cx - 4) c = k; return c; };
      const below = items.filter((it) => it.y < head.y - 3);
      const foot = Math.max(-Infinity, ...below.filter((it) => /^this statement|^page:|^الصفحة/i.test(it.s)).map((it) => it.y));
      const rows = below.filter((it) => it.y > foot + 2);
      const anchors = rows.filter((it) => colOf(it.x) === "date" && /^\d{1,2}[/.\-]\d{1,2}[/.\-]\d{4}$/.test(normDigits(it.s))).sort((a, b) => b.y - a.y);
      const order = dateOrder(anchors.map((a) => a.s));
      anchors.forEach((an, i) => {
        const top = an.y + 3, bottom = i + 1 < anchors.length ? anchors[i + 1].y + 3 : -Infinity;
        const cell = { type: [], desc: [], debit: [], credit: [], amount: [], balance: [] };
        for (const it of rows) if (it.y <= top && it.y > bottom) { const c = colOf(it.x); if (cell[c]) cell[c].push(it); }
        const asLines = (arr) => {
          const g = {};
          for (const it of arr) (g[Math.round(it.y)] = g[Math.round(it.y)] || []).push(it);
          return Object.keys(g).sort((a, b) => b - a).map((k) => g[k].sort((a, b) => a.x - b.x).map((it) => it.s).join(" "));
        };
        const num = (arr) => (arr.length ? toNumber(arr.map((it) => it.s).join("")) : NaN);
        const deb = num(cell.debit), cre = num(cell.credit), am = num(cell.amount);
        let a = NaN;
        if (isFinite(deb) || isFinite(cre)) a = (isFinite(cre) ? Math.abs(cre) : 0) - (isFinite(deb) ? Math.abs(deb) : 0);
        else if (isFinite(am)) a = am;
        const d = toISO(an.s, order);
        if (!d || !isFinite(a) || Math.abs(a) < 0.005) return;
        const info = describeRow(asLines(cell.type).join(" "), asLines(cell.desc), a);
        out.push({ d, t: cleanDesc(info.t) || "Transaction", a: Math.round(a * 100) / 100, c: info.c, b: num(cell.balance) });
      });
    }
    return { found, tx: out, anyText, headText };
  }

  }

  const ICON_OK = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--good)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_BAD = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--danger)"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const ICON_TICK = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="var(--good)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function openImport() {
    openSheet(`
      <div class="sheet-head"><button class="link-btn left" data-act="cancel">Cancel</button><h2>Import statement</h2><span></span></div>
      <input type="file" id="stmtFile" class="visually-hidden" aria-label="Statement file">
      <div id="impBody">
        <ol class="steps">
          <li>In your bank's app (Al Rajhi, SNB AlAhli and others), open the statement for the account or card you spend from.</li>
          <li>Pick a period, for example last month, and export or share it as a <b>PDF</b> or <b>Excel</b> file. Save it to Files.</li>
          <li>Choose that file here. Savings Jar checks that it's a bank statement before importing anything.</li>
        </ol>
        <label class="btn primary file-btn" for="stmtFile">Choose statement file</label>
        <p class="hint" style="margin-top:12px">The file is read on this device. Savings Jar keeps only each transaction's date, description and amount, and hides long card or account numbers.</p>
      </div>`, (sheet) => {
      sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
      $("#stmtFile", sheet).onchange = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const box = $("#impBody", sheet);
        box.innerHTML = `<div class="checking" role="status"><span class="spinner" aria-hidden="true"></span><span>Checking <b class="ps-file" dir="auto"></b>…</span></div>`;
        box.querySelector(".ps-file").textContent = file.name;
        let v;
        try { v = await analyzeFile(file); }
        catch (ex) {
          v = ex && ex.message === "load"
            ? reject("Couldn't check the file", "The file reader didn't load.", "Check your internet connection and try again.")
            : reject("Couldn't check the file", "Something went wrong while reading it.", EXPORT_HELP);
        }
        if (!sheet.isConnected) return;
        if (v.ok) showPreview(sheet, v.res, file.name, v); else showRejected(sheet, v, file.name);
      };
    });
  }

  function showRejected(sheet, v, fileName) {
    const box = $("#impBody", sheet);
    box.innerHTML = `
      <div class="verdict bad" role="alert">
        <div class="v-head">${ICON_BAD}<div><b>${esc(v.title)}</b><span class="ps-file" dir="auto"></span></div></div>
        <p>${esc(v.reason)}</p>
        <p class="hint">${esc(v.help)}</p>
      </div>
      <label class="btn primary file-btn" for="stmtFile">Choose another file</label>
      ${v.canMap ? `<button class="btn ghost" id="mapAnyway" style="width:100%;margin-top:8px">It is a bank statement: pick the columns</button>` : ""}`;
    box.querySelector(".ps-file").textContent = fileName;
    const m = $("#mapAnyway", sheet);
    if (m) m.onclick = () => showMapping(sheet, v.res, fileName, "Pick which column holds each part of the transactions.");
  }

  function showPreview(sheet, res, fileName, verdict) {
    const ex = res.pdf ? { tx: res.tx, assumedSpending: false } : extract(res.rows, res.headerRow, res.map);
    if (!verdict) verdict = { checks: [`Table of ${ex.tx.length} dated transactions found`, "Columns chosen by you"], warn: "" };
    if (!ex.tx.length) { showMapping(sheet, res, fileName, "No transactions were found with those columns. Check which column is which."); return; }
    const ds = ex.tx.map((t) => t.d).sort();
    const spent = ex.tx.reduce((s, t) => s + (t.a < 0 && t.c !== "own" ? -t.a : 0), 0), inc = ex.tx.reduce((s, t) => s + (t.a > 0 && t.c !== "own" ? t.a : 0), 0);
    const { dup } = mergeTx(ex.tx, { dryRun: true });
    const long = (iso) => isoToDate(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    const box = $("#impBody", sheet);
    box.innerHTML = `
      <div class="verdict ok">
        <div class="v-head">${ICON_OK}<div><b>Bank statement accepted</b><span class="ps-file" dir="auto"></span></div></div>
        <ul class="v-checks">${verdict.checks.map((c) => `<li>${ICON_TICK}<span>${esc(c)}</span></li>`).join("")}</ul>
        ${verdict.warn ? `<p class="hint err">${esc(verdict.warn)}</p>` : ""}
      </div>
      <div class="preview-sum">
        <span class="ps-big num">${ex.tx.length} transactions</span>
        <span class="hint num">${esc(long(ds[0]))} – ${esc(long(ds[ds.length - 1]))}</span>
        <div class="inout num"><span>Spent <b>${esc(fmt(spent, true))}</b></span><span>Money in <b>${esc(fmt(inc, true))}</b></span></div>
        ${dup ? `<p class="hint">${dup} of these ${dup === 1 ? "was" : "were"} imported before and will be skipped.</p>` : ""}
        ${ex.assumedSpending ? `<p class="hint">Every amount in this file is positive, so they're all counted as spending.</p>` : ""}
        ${ex.tx.some((t) => t.c === "own") ? `<p class="hint">Transfers to your own accounts are shown separately and not counted as spending.</p>` : ""}
      </div>
      ${state.currency !== "SAR" ? `<div class="toggle-row" style="margin-bottom:10px"><label for="impSar">Show amounts in Saudi riyals (SAR)</label><span class="switch"><input type="checkbox" id="impSar" role="switch" checked><i></i></span></div>` : ""}
      <span class="label">First few</span>
      <ul class="txs">${txItems([...ex.tx].sort((a, b) => (a.d < b.d ? 1 : -1)).slice(0, 5), false)}</ul>
      ${res.pdf ? `<button class="btn primary" style="width:100%;margin-top:14px" id="impGo">Import</button>` : `<div class="row2"><button class="btn" id="impFix">Columns look wrong</button><button class="btn primary" id="impGo">Import</button></div>`}`;
    box.querySelector(".ps-file").textContent = fileName;
    if (!res.pdf) $("#impFix", sheet).onclick = () => showMapping(sheet, res, fileName);
    $("#impGo", sheet).onclick = () => {
      const sar = $("#impSar", sheet);
      if (sar && sar.checked) { state.currency = "SAR"; for (const k in fmtCache) delete fmtCache[k]; commit(); }
      if (spend.sample) { spend.tx = spend.tx.filter((t) => !t.s); spend.sample = false; }
      const r = mergeTx(ex.tx);
      commitSpend();
      closeSheet();
      spendMonth = null; openCat = null; tab = "spend";
      renderHome();
      toast(r.added ? `Imported ${r.added} transactions` : "Nothing new: these were already imported");
    };
  }

  function showMapping(sheet, res, fileName, msg) {
    const head = res.rows[res.headerRow] || [], sample = res.rows[res.headerRow + 1] || [];
    const width = Math.max(head.length, sample.length);
    const show = (v) => (v instanceof Date ? v.toLocaleDateString() : String(v ?? "")).slice(0, 18);
    const cols = Array.from({ length: width }, (_, i) => {
      const h = show(head[i]).trim(), s = show(sample[i]).trim();
      return { i, label: (h || `Column ${i + 1}`) + (s && s !== h ? ` (e.g. ${s})` : "") };
    });
    const m = res.map || {};
    const sel = (id, label, cur, hint) => `<div class="field"><label for="${id}">${label}</label>
      <select class="input" id="${id}"><option value="">None</option>${cols.map((c) => `<option value="${c.i}"${cur === c.i ? " selected" : ""}>${esc(c.label)}</option>`).join("")}</select>${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
    const box = $("#impBody", sheet);
    box.innerHTML = `
      <p>${esc(msg || "Savings Jar couldn't tell which column is which in this file. Pick them below.")}</p>
      <div class="map-grid">
        ${sel("mDate", "Date", m.date)}
        ${sel("mDesc", "Description", m.desc)}
        ${sel("mOut", "Money out (debit)", m.out, "If your file has separate debit and credit columns.")}
        ${sel("mIn", "Money in (credit)", m.in)}
        ${sel("mAmt", "Single amount column", m.amount, "Use this instead if one column holds every amount, with a minus for money out.")}
      </div>
      <p class="hint err" id="mapErr" role="alert" hidden></p>
      <button class="btn primary" style="width:100%" id="mapGo">Continue</button>`;
    $("#mapGo", sheet).onclick = () => {
      const v = (id) => { const x = $("#" + id, sheet).value; return x === "" ? undefined : Number(x); };
      const map = { date: v("mDate"), desc: v("mDesc"), out: v("mOut"), in: v("mIn"), amount: v("mAmt") };
      if (map.out != null || map.in != null) delete map.amount;
      if (!validMap(map)) { const e = $("#mapErr", sheet); e.textContent = "Choose a date column, a description column and at least one amount column."; e.hidden = false; return; }
      showPreview(sheet, { ...res, map }, fileName, null);
    };
  }

  function loadSample() {
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const list = [], now = new Date();
    for (let back = 2; back >= 1; back--) {
      const first = new Date(now.getFullYear(), now.getMonth() - back, 1);
      const Y = first.getFullYear(), M = first.getMonth() + 1, days = new Date(Y, M, 0).getDate();
      const add = (d, t, a) => list.push({ d: `${Y}-${pad(M)}-${pad(Math.min(d, days))}`, t, a: Math.round(a * 100) / 100 });
      const any = () => 1 + Math.floor(rnd() * days);
      add(27, "SALARY / راتب", 11500); add(1, "EJAR RENT PAYMENT", -2500); add(3, "STC BILL PAYMENT", -230);
      add(5, "NETFLIX.COM", -45); add(9, "SHAHID VIP", -30); add(12, "SEC ELECTRICITY SADAD", -(180 + rnd() * 60));
      for (let i = 0; i < 11; i++) add(any(), pick(["HUNGERSTATION", "JAHEZ", "هنقرستيشن", "THE CHEFZ", "KEETA"]), -(35 + rnd() * 70));
      for (let i = 0; i < 9; i++) add(any(), pick(["STARBUCKS RIYADH", "BARNS CAFE", "ALBAIK", "KUDU", "DR.CAFE COFFEE", "HALF MILLION"]), -(18 + rnd() * 45));
      for (let i = 0; i < 5; i++) add(any(), pick(["PANDA RETAIL CO", "TAMIMI MARKETS", "DANUBE", "بنده"]), -(70 + rnd() * 260));
      for (let i = 0; i < 6; i++) add(any(), pick(["ALDREES PETROLEUM", "SASCO STATION", "UBER *TRIP", "CAREEM"]), -(25 + rnd() * 95));
      for (let i = 0; i < 3; i++) add(any(), pick(["AMAZON.SA", "NOON.COM", "JARIR BOOKSTORE", "SHEIN"]), -(60 + rnd() * 340));
      add(any(), "NAHDI PHARMACY", -(30 + rnd() * 90)); add(any(), "VOX CINEMAS", -(90 + rnd() * 80));
      add(any(), "ATM CASH WITHDRAWAL", -500); add(any(), "SARIE TRANSFER TO FRIEND", -300);
    }
    spend.tx = spend.tx.filter((t) => !t.s);
    mergeTx(list, { sample: true });
    spend.sample = true;
    commitSpend();
    spendMonth = null; openCat = null;
    renderHome();
    toast("Loaded a sample statement");
  }

  // ---------- toast ----------
  let toastTimer = 0;
  function toast(msg, undo) {
    clearTimeout(toastTimer);
    const root = $("#toastRoot");
    root.innerHTML = `<div class="toast" role="status"><span></span>${undo ? '<button type="button">Undo</button>' : ""}</div>`;
    root.querySelector("span").textContent = msg;
    if (undo) root.querySelector("button").onclick = () => { root.innerHTML = ""; undo(); };
    toastTimer = setTimeout(() => (root.innerHTML = ""), undo ? 5000 : 3200);
  }

  // ---------- confetti ----------
  function confetti() {
    if (reduceMotion()) { toast("Goal reached! 🎉"); return; }
    const cv = $("#confetti"), ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.hidden = false;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pal = Object.values(COLORS).map((c) => c.c).concat(["#F5B83A", "#FFFFFF"]);
    const ps = Array.from({ length: 140 }, () => ({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.3, vx: (Math.random() - 0.5) * 120, vy: 60 + Math.random() * 160,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 12, s: 7 + Math.random() * 7, c: pal[(Math.random() * pal.length) | 0],
    }));
    const start = performance.now(), dur = 3200;
    let last = start;
    const frame = (t) => {
      const dt = Math.min((t - last) / 1000, 0.05); last = t;
      const age = t - start;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = age > dur - 700 ? Math.max((dur - age) / 700, 0) : 1;
      for (const p of ps) {
        p.vy += 380 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2 * Math.abs(Math.cos(p.r * 0.7)) + 1);
        ctx.restore();
      }
      if (age < dur) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    };
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  function renderAll() {
    if (openJarId && jarById(openJarId)) updateDetail(false);
    else { if (openJarId) closeJar(); renderHome(); }
  }
  $("#settingsBtn").onclick = openSettings;
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
  { const l = normalize(SavingsSync.readLocal()); if (l) state = l; }
  { const l = normalizeSpend(SpendSync.readLocal()); if (l) spend = l; }
  try { const t = localStorage.getItem("savings-jar-tab"); if (t === "spend") tab = "spend"; } catch {}
  renderHome();
  Store.setMode("local");
  Store.init();
})();
</script>
