<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Availability Report</title>
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <header class="head">
    <div class="title-block">
      <span class="logo" id="logo" hidden></span>
      <div>
      <h1 id="title">Availability Report</h1>
      <div class="sub" id="period">Choose a period and press Generate</div>
      </div>
    </div>
    <form class="controls" id="controls">
      <label>Period
        <select id="range">
          <option value="last-week">Last week</option>
          <option value="this-week">This week</option>
          <option value="last-7">Last 7 days</option>
          <option value="last-month">Last month</option>
          <option value="this-month">This month</option>
          <option value="month">Pick a month…</option>
          <option value="custom">Custom dates…</option>
        </select>
      </label>
      <label id="month-wrap">Month <input type="month" id="month"></label>
      <label id="from-wrap">From <input type="date" id="from"></label>
      <label id="to-wrap">To <input type="date" id="to"></label>
      <label id="scope-wrap">Covering <select id="scope"></select></label>
      <label>SLA target % <input type="number" id="sla" step="0.01" min="0" max="100"></label>
      <button type="submit" id="go">Generate</button>
      <button type="button" id="csv" disabled>Export CSV</button>
      <button type="button" id="print" disabled>Print / PDF</button>
    </form>
  </header>

  <div class="progress" id="progress" hidden></div>
  <div class="error" id="error" hidden></div>

  <section class="kpis" id="kpis" hidden></section>
  <main id="tables"></main>

  <footer class="foot" id="foot" hidden></footer>

  <script src="config.js"></script>
  <script src="report.js"></script>
</body>
</html>
