<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NOC Dashboard</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" id="logo" hidden></span>
      <span class="conn" id="conn" title="Connection to PRTG"></span>
      <div>
        <div class="title-row"><h1 id="title">NOC Dashboard</h1><nav class="dash-nav" id="nav" hidden></nav></div>
        <div class="sub" id="subtitle">Connecting to PRTG…</div>
      </div>
    </div>

    <div class="summary" id="summary" aria-label="Sensor summary"></div>

    <button type="button" class="hdr-btn" id="reports-btn" title="Weekly / monthly availability reports (R)">Reports</button>

    <div class="clock">
      <div class="time" id="clock-time">--:--:--</div>
      <div class="date" id="clock-date"></div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="layout">
    <section class="sections" id="sections" aria-label="Devices"></section>

    <aside class="alerts">
      <button type="button" class="side-rail" id="side-rail" title="Show alerts (A)">
        <span class="count" id="rail-count">0</span>
        <span class="rail-label">Alerts</span>
      </button>
      <div class="alerts-head">
        <h2>Active alerts</h2>
        <span class="count" id="alert-count">0</span>
        <button type="button" class="panel-toggle" id="side-toggle" title="Collapse alerts (A)">&rsaquo;</button>
      </div>
      <ol class="alert-list" id="alert-list"></ol>
    </aside>
  </main>

  <section class="insights" id="insights" aria-label="Link insights" hidden>
    <button type="button" class="panel-toggle ins-toggle" id="ins-toggle" title="Collapse insights (I)">&#9662;</button>
    <div class="ins-mini" id="ins-mini"></div>
    <div class="ins-wrap" id="ins-wrap"><div class="ins-body" id="ins-body"></div></div>
  </section>

  <div class="detail" id="detail" hidden>
    <div class="detail-card" id="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-head">
      <div class="detail-top">
        <div id="detail-head"></div>
        <button type="button" class="detail-close" id="detail-close" aria-label="Close">&times;</button>
      </div>
      <div class="chips" id="detail-sensors" hidden></div>
      <div class="d-bar">
        <div class="tabs" id="detail-tabs"></div>
        <span class="spacer"></span>
        <a class="d-open" id="detail-open" target="_blank" rel="noopener">Open in PRTG &rarr;</a>
      </div>
      <div class="graph-box" id="detail-graph-box">
        <img id="detail-graph" alt="">
        <div class="graph-msg" id="detail-graph-msg" hidden></div>
      </div>
    </div>
  </div>

  <div class="reports" id="reports" hidden>
    <div class="reports-bar">
      <span id="reports-title">Availability reports</span>
      <button type="button" class="detail-close" id="reports-close" aria-label="Close reports">&times;</button>
    </div>
    <iframe id="reports-frame" title="Availability report"></iframe>
  </div>
  <template id="report-src"></template>

  <div class="build-stamp" id="build-stamp"></div>
  <script src="config.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
