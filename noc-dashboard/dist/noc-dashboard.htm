<!doctype html>
<!-- PRTG NOC Dashboard - single-file build. Edit NOC_CONFIG below to change layout. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NOC Dashboard</title>
  <style>
:root {
  --bg: #0b0f14;
  --accent: #58a6ff;      /* UI accent (buttons, focus, charts) - themes override */
  --panel: #111821;
  --panel-2: #16202b;
  --border: #223041;
  --text: #e6edf3;
  --muted: #8b98a7;

  --up: #2ea043;
  --warn: #e3b341;
  --unusual: #f0883e;
  --down: #f85149;
  --ack: #b4605c;
  --paused: #58a6ff;
  --unknown: #8b949e;

  --radius: 8px;
  font-size: clamp(12px, 0.78vw, 22px); /* scales 1080p -> 4K wall screens */
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.35;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body.kiosk.mouse-idle, body.kiosk.mouse-idle * { cursor: none !important; }

h1, h2 { margin: 0; font-weight: 600; }

/* status colour plumbing: every .s-<status> sets --c */
.s-up      { --c: var(--up); }
.s-warn    { --c: var(--warn); }
.s-unusual { --c: var(--unusual); }
.s-down    { --c: var(--down); }
.s-ack     { --c: var(--ack); }
.s-paused  { --c: var(--paused); }
.s-unknown { --c: var(--unknown); }

/* ---------------------------------------------------------------- header */
.top {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  padding: .6rem 1.2rem;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}

.brand { display: flex; align-items: center; gap: .8rem; min-width: 0; flex: 0 0 auto; }
.title-row { display: flex; align-items: center; gap: .6rem; }
.brand h1 { font-size: 1.45rem; letter-spacing: .02em; white-space: nowrap; }
.brand .sub { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.conn {
  width: .9rem; height: .9rem; border-radius: 50%;
  background: var(--unknown); flex: 0 0 auto;
  box-shadow: 0 0 0 3px rgba(255,255,255,.05);
}
.conn.ok   { background: var(--up); }
.conn.warn { background: var(--warn); }
.conn.bad  { background: var(--down); animation: blink 1s steps(2) infinite; }
.conn.wait { background: var(--unknown); animation: blink 1.5s steps(2) infinite; }

.summary { display: flex; gap: .5rem; flex: 1 1 auto; justify-content: center; flex-wrap: nowrap; min-width: 0; overflow: hidden; }

.pill {
  display: flex; align-items: baseline; gap: .45rem;
  padding: .35rem .8rem;
  border-radius: var(--radius);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--c, var(--muted));
  min-width: 6.5rem;
}
.pill .n { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c, var(--text)); }
.pill .l { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.pill.zero { opacity: .45; }
.pill.s-down:not(.zero) { background: color-mix(in srgb, var(--down) 22%, var(--panel-2)); animation: pulse 2s ease-in-out infinite; }
.pill.s-down:not(.zero) .n { color: #fff; }
.pill.total { --c: var(--text); }

.clock { text-align: right; flex: 0 0 auto; }
.clock .time { font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.clock .date { color: var(--muted); font-size: .8rem; }

/* ---------------------------------------------------------------- banner */
.banner {
  flex: 0 0 auto;
  padding: .5rem 1.2rem;
  font-weight: 600;
  background: color-mix(in srgb, var(--warn) 25%, var(--bg));
  border-bottom: 1px solid var(--warn);
}
.banner.bad { background: color-mix(in srgb, var(--down) 35%, var(--bg)); border-color: var(--down); }
.banner[hidden] { display: none; }

body.stale .sections, body.stale .alert-list { filter: grayscale(.85); opacity: .6; }

/* ---------------------------------------------------------------- layout */
.layout {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) min(24rem, 23vw);
}

.sections {
  overflow-y: auto;
  padding: 1rem 1.2rem 2rem;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 1rem;
}

.section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-top: 3px solid var(--c, var(--border));
  border-radius: var(--radius);
  padding: .7rem .9rem .9rem;
  flex: 1 1 auto;   /* small groups share a row, big groups take the full width */
  max-width: 100%;
}
.section.s-up { border-top-color: var(--border); }

.section-head { display: flex; align-items: baseline; gap: .8rem; margin-bottom: .6rem; }
.section-head h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .08em; }
.section-head .meta { color: var(--muted); font-size: .8rem; }

.tiles {
  display: flex;
  flex-wrap: wrap;
  gap: .6rem;
}

.tile {
  position: relative;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 5px solid var(--c);
  border-radius: 6px;
  padding: .5rem .65rem .55rem;
  width: 15.5rem;
  flex: 0 0 auto;
}
.tile.s-down { background: color-mix(in srgb, var(--down) 18%, var(--panel-2)); border-color: var(--down); }
.tile.s-warn { background: color-mix(in srgb, var(--warn) 10%, var(--panel-2)); }
.tile.s-unusual { background: color-mix(in srgb, var(--unusual) 10%, var(--panel-2)); }
.tile.s-paused { opacity: .6; }

.tile-top { display: flex; align-items: center; gap: .45rem; min-width: 0; }
.tile .dot { width: .65rem; height: .65rem; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.tile.s-down .dot { animation: blink 1s steps(2) infinite; }
.tile .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }

.tile .sub { display: flex; gap: .5rem; align-items: baseline; margin: .1rem 0 0 1.1rem; min-width: 0; }
.tile .host {
  color: var(--muted);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: .78rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0;
}
.tile .state { font-size: .72rem; color: var(--c); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; margin-left: auto; }
.tile.s-up .state { color: var(--muted); }

.counts { display: flex; gap: .3rem; margin: .35rem 0 0 1.1rem; flex-wrap: wrap; }
.counts .c {
  font-size: .72rem; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: .05rem .4rem; border-radius: 4px;
  color: #0b0f14; background: var(--c);
}
.counts .c.s-up { background: transparent; color: var(--up); border: 1px solid color-mix(in srgb, var(--up) 50%, transparent); }
.counts .c.none { background: transparent; color: var(--muted); font-weight: 400; }

.problems { list-style: none; margin: .4rem 0 0 1.1rem; padding: 0; font-size: .8rem; }
.problems li { display: flex; gap: .5rem; padding: .1rem 0; border-top: 1px dashed var(--border); }
.problems li .pn { color: var(--c); flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.problems li .pv { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.problems li.more { color: var(--muted); }
.problems.all li.s-up .pn { color: var(--text); }
.problems.all li.s-up .pv { color: var(--up); }
.problems.all li.s-paused .pn, .problems.all li.s-paused .pv { color: var(--muted); }

.empty { color: var(--muted); padding: 2rem; text-align: center; }

/* ---------------------------------------------------------------- map-style panels */
.panels {
  flex: 1 1 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
  gap: 1rem;
  align-items: start;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-top: 3px solid var(--c, var(--border));
  border-radius: var(--radius);
  padding: .7rem .8rem .8rem;
}
.panel.s-up { border-top-color: var(--up); }
.panel .section-head .meta { display: none; }
.panel .section-head h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .04em; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.row {
  display: flex; align-items: center; gap: .6rem;
  padding: .45rem .6rem;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--c);
  border-radius: 6px;
  min-width: 0;
}
.row .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.row .lbl { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.row .name { font-weight: 600; font-size: 1.1rem; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .line2 { display: flex; align-items: baseline; gap: .5rem; min-width: 0; }
.row .dev { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
.row .v { font-size: 1.1rem; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; flex: 0 0 auto; }
.row.s-up .v { color: var(--text); }
.row .st { font-size: .7rem; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.row.s-down { background: color-mix(in srgb, var(--down) 18%, var(--panel-2)); border-color: var(--down); }
.row.s-down .dot { animation: blink 1s steps(2) infinite; }
.row.s-warn { background: color-mix(in srgb, var(--warn) 10%, var(--panel-2)); }
.row.s-unusual { background: color-mix(in srgb, var(--unusual) 10%, var(--panel-2)); }
.row.s-paused { opacity: .6; }
.row.missing { --c: var(--unknown); opacity: .55; font-style: italic; border-style: dashed; }

/* ---------------------------------------------------------------- alerts */
.alerts {
  border-left: 1px solid var(--border);
  background: var(--panel);
  display: flex; flex-direction: column;
  min-height: 0;
}
.alerts-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: .8rem 1rem; border-bottom: 1px solid var(--border);
}
.alerts-head h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .08em; }
.alerts-head .count {
  font-weight: 700; font-variant-numeric: tabular-nums;
  padding: .1rem .6rem; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--border);
}
.alerts-head .count.hot { background: var(--down); border-color: var(--down); color: #fff; }

.alert-list { list-style: none; margin: 0; padding: .6rem; overflow-y: auto; flex: 1 1 auto; display: flex; flex-direction: column; gap: .45rem; }

.alert {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 5px solid var(--c);
  border-radius: 6px;
  padding: .45rem .6rem;
}
.alert.s-down { background: color-mix(in srgb, var(--down) 16%, var(--panel-2)); }
.alert.new { animation: flash 1s ease-in-out 6; }

.a-top { display: flex; align-items: center; gap: .5rem; min-width: 0; }
.badge {
  font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  padding: .05rem .4rem; border-radius: 4px; background: var(--c); color: #0b0f14; white-space: nowrap;
}
.a-dev { font-weight: 600; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-since { color: var(--muted); font-size: .75rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.a-sensor { margin-top: .15rem; font-size: .88rem; }
.a-msg { color: var(--muted); font-size: .8rem; margin-top: .1rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.a-group { color: var(--muted); font-size: .7rem; margin-top: .15rem; text-transform: uppercase; letter-spacing: .05em; opacity: .75; }

.all-clear { display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: 3rem 1rem; color: var(--up); }
.all-clear .big { font-size: 3rem; line-height: 1; }
.alert-list .more { color: var(--muted); text-align: center; padding: .4rem; }

/* ---------------------------------------------------------------- motion */
@keyframes blink { 50% { opacity: .25; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--down) 35%, transparent); } }
@keyframes flash { 50% { background: color-mix(in srgb, var(--c) 40%, var(--panel-2)); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

/* ---------------------------------------------------------------- small screens (laptop / phone check-ins) */
@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  .top { flex-wrap: wrap; gap: .8rem; padding: .6rem 1rem; }
  .summary { order: 3; flex-basis: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .pill { min-width: 0; }
  .layout { display: flex; flex-direction: column-reverse; }
  .alerts { border-left: 0; border-bottom: 1px solid var(--border); }
  .alert-list { max-height: 40vh; }
  .sections { overflow: visible; padding: 1rem; }
  .section { flex-basis: 100%; }
  .tile { width: 100%; }
}

/* ---------------------------------------------------------------- clickable rows + detail panel */
.clickable { cursor: pointer; transition: filter .15s, transform .15s; }
.clickable:hover { filter: brightness(1.25); }
.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.detail {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, .65);
  display: flex; align-items: center; justify-content: center;
  padding: 2vh 2vw;
}
.detail[hidden] { display: none; }
.detail-card {
  width: min(80rem, 94vw); max-height: 94vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--border); border-top: 4px solid var(--c, var(--border));
  border-radius: 10px; padding: 1rem 1.2rem 1.2rem;
  box-shadow: 0 1rem 3rem rgba(0, 0, 0, .5);
}
.detail-top { display: flex; align-items: flex-start; gap: 1rem; }
.detail-top > div { flex: 1 1 auto; min-width: 0; }
.detail-close {
  flex: 0 0 auto; font: inherit; font-size: 1.4rem; line-height: 1; padding: .2rem .55rem;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
}
.d-title { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.d-title h2 { font-size: 1.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-title .dot { width: .9rem; height: .9rem; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.d-title .badge { flex: 0 0 auto; }
.d-facts { display: flex; flex-wrap: wrap; gap: .4rem 1.6rem; margin-top: .6rem; }
.fact { display: flex; flex-direction: column; min-width: 0; }
.fact .k { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fact .v { font-weight: 600; overflow-wrap: anywhere; }
.d-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 1rem 0 .6rem; }
.d-bar .spacer { flex: 1 1 auto; }
.chips, .tabs { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip, .tab {
  font: inherit; font-size: .85rem; padding: .3rem .7rem; border-radius: 999px; cursor: pointer;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
}
.chip { border-left: 4px solid var(--c); border-radius: 6px; }
.chip.on, .tab.on { background: var(--accent); border-color: var(--accent); color: #0b0f14; font-weight: 700; }
.d-open { color: var(--accent); font-weight: 600; text-decoration: none; }
.d-open:hover { text-decoration: underline; }
.graph-box {
  background: #fff; border-radius: 8px; padding: .4rem; min-height: 12rem;
  display: flex; align-items: center; justify-content: center;
}
.graph-box img { display: block; width: 100%; height: auto; }
.graph-box img:not([src]) { display: none; }
.graph-msg { color: #444; padding: 2rem; text-align: center; }

/* ---------------------------------------------------------------- dashboard switcher */
.dash-nav { display: flex; gap: .3rem; }
.dash-nav[hidden] { display: none; }
.dash-nav a {
  font-size: .8rem; font-weight: 600; text-decoration: none; color: var(--muted);
  padding: .25rem .65rem; border: 1px solid var(--border); border-radius: 999px; white-space: nowrap;
}
.dash-nav a.on { color: #0b0f14; background: var(--accent); border-color: var(--accent); }
.dash-nav a:hover { color: var(--text); }

/* ---------------------------------------------------------------- insights strip */
.insights {
  flex: 0 0 auto;
  position: relative;
  padding: .6rem 3rem .8rem 1.2rem;
  background: var(--panel);
  border-top: 1px solid var(--border);
}
.insights[hidden] { display: none; }
.ins-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1.6fr);
  gap: .8rem;
}
.ins-card { min-width: 0; }
.ins-card h3 {
  margin: 0 0 .35rem; font-size: .9rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em; display: flex; gap: .6rem; align-items: baseline;
}
.ins-note { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: .8rem; opacity: .8; }
.ins-big { font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.ins-sub { color: var(--muted); font-size: .9rem; margin-bottom: .35rem; }
.ins-bars { display: flex; flex-direction: column; gap: .2rem; }
.ins-bar { display: grid; grid-template-columns: minmax(0, 7.5rem) 1fr auto; gap: .5rem; align-items: center; font-size: .9rem; }
.ins-bar .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.ins-bar .track { height: .45rem; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.ins-bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.ins-bar .v { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ins-top { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .2rem; }
.ins-top li {
  display: grid; grid-template-columns: minmax(0, 1fr) 4.5rem auto; gap: .5rem; align-items: center;
  font-size: 1rem; padding: .1rem .3rem; border-left: 3px solid var(--c); border-radius: 3px;
}
.ins-top .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ins-top .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spark { width: 100%; height: 1.1rem; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ins-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .25rem; }
.ins-list li { display: flex; gap: .5rem; align-items: baseline; font-size: 1rem; line-height: 1.3; }
.ins-list .pip { width: .55rem; height: .55rem; border-radius: 50%; flex: 0 0 auto; transform: translateY(-.05rem); }
.ins-list .sev0 .pip { background: var(--down); }
.ins-list .sev1 .pip { background: var(--unusual); }
.ins-list .sev2 .pip { background: var(--warn); }
.ins-list .sev3 .pip { background: var(--unknown); }
.ins-list .sev0 .t { color: #ffb4ae; font-weight: 600; }
.ins-list .ok { color: var(--up); }
.ins-list .more { color: var(--muted); }
@media (max-width: 900px) {
  .ins-body { grid-template-columns: 1fr; }
}

/* ---------------------------------------------------------------- views, collapsible panels, dismiss */
.dash-nav button {
  font: inherit; font-size: .8rem; font-weight: 600; color: var(--muted); cursor: pointer;
  padding: .25rem .75rem; background: transparent; border: 1px solid var(--border); border-radius: 999px; white-space: nowrap;
}
.dash-nav button.on { color: #0b0f14; background: var(--accent); border-color: var(--accent); }
.dash-nav button:hover { color: var(--text); }
.dash-nav button.on:hover { color: #0b0f14; }

.panel-toggle {
  font: inherit; font-size: 1.1rem; line-height: 1; cursor: pointer; color: var(--muted);
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: .15rem .5rem;
}
.panel-toggle:hover { color: var(--text); }
.alerts-head .panel-toggle { margin-left: .5rem; }
.alerts-head .count { margin-left: auto; }

/* side panel collapsed -> thin rail with the alert count */
.side-rail { display: none; }
body.side-collapsed .layout { grid-template-columns: minmax(0, 1fr) 3rem; }
body.side-collapsed .alerts > :not(.side-rail) { display: none; }
body.side-collapsed .side-rail {
  display: flex; flex-direction: column; align-items: center; gap: .8rem;
  width: 100%; height: 100%; padding: .9rem 0; cursor: pointer;
  background: transparent; border: 0; color: var(--muted); font: inherit;
}
.side-rail:hover { background: var(--panel-2); color: var(--text); }
.rail-label { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .15em; text-transform: uppercase; font-size: .8rem; font-weight: 600; }
.side-rail .count {
  font-weight: 700; font-variant-numeric: tabular-nums; padding: .1rem .45rem; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
}
.side-rail .count.hot { background: var(--down); border-color: var(--down); color: #fff; animation: pulse 2s ease-in-out infinite; }

/* insights collapsed -> one summary line */
.ins-toggle { position: absolute; top: .5rem; right: .8rem; }
.ins-mini { display: none; }
body.ins-collapsed .ins-body { display: none; }
body.ins-collapsed .insights { padding-top: .45rem; padding-bottom: .45rem; }
body.ins-collapsed .ins-toggle { top: 50%; transform: translateY(-50%); }
body.ins-collapsed .ins-mini {
  display: flex; gap: 1.2rem; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden; font-size: .95rem;
}
.ins-mini span:last-child { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.ins-mini.sev0 span:last-child { color: #ffb4ae; font-weight: 600; }
.ins-mini.sev1 span:last-child { color: var(--unusual); }
.ins-mini.sev2 span:last-child { color: var(--warn); }
.ins-mini b { font-variant-numeric: tabular-nums; }

/* dismiss / restore alerts */
.a-dismiss {
  flex: 0 0 auto; margin-left: .3rem; font: inherit; font-size: .85rem; line-height: 1; cursor: pointer;
  padding: .15rem .4rem; border-radius: 5px; color: var(--muted);
  background: transparent; border: 1px solid var(--border);
}
.a-dismiss:hover { color: var(--text); border-color: var(--muted); }
.alert.dismissed { opacity: .45; }
.a-toggle {
  font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted);
  background: transparent; border: 0; text-decoration: underline;
}
@media (max-width: 900px) {
  body.side-collapsed .layout { display: flex; flex-direction: column-reverse; }
  .rail-label { writing-mode: horizontal-tb; transform: none; }
  body.side-collapsed .side-rail { flex-direction: row; justify-content: center; height: auto; }
}

/* ---------------------------------------------------------------- brand: logo / wordmark */
.logo { display: flex; align-items: center; flex: 0 0 auto; padding-right: .9rem; margin-right: .1rem; border-right: 1px solid var(--border); }
.logo[hidden] { display: none; }
.logo img { display: block; height: 2.1rem; width: auto; }
.wm { font-size: 1.75rem; font-weight: 300; letter-spacing: .01em; line-height: 1; white-space: nowrap; }
.wm-a { color: #b4b2c4; }
.wm-b { color: var(--accent); font-weight: 400; }

/* ---------------------------------------------------------------- theme: AlasilaCX */
/* Brand palette: purple gradient #8B86B8 -> #554D93, cyan #5CCBE2, logo grey #8E8E8E.
   Status colours stay standard NOC green / amber / red / blue on purpose. */
body.theme-alasilacx {
  --bg: #12102a;
  --panel: #1a1736;
  --panel-2: #221e44;
  --border: #332e60;
  --text: #eceaf8;
  --muted: #a39fc9;
  --accent: #5ccbe2;
  --brand-hi: #8b86b8;
  --brand-lo: #554d93;
  font-family: "Titillium Web", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
.theme-alasilacx .top {
  background: linear-gradient(90deg, #1d1a3d 0%, #26214f 100%);
  border-bottom: 2px solid var(--accent);
}
.theme-alasilacx .brand h1 { color: #fff; }
.theme-alasilacx .section.s-up,
.theme-alasilacx .panel.s-up { border-top-color: var(--brand-hi); }
.theme-alasilacx .section-head h2,
.theme-alasilacx .alerts-head h2,
.theme-alasilacx .ins-card h3 { color: #c9c6e6; }
.theme-alasilacx .section-head h2::before,
.theme-alasilacx .alerts-head h2::before {
  content: ''; display: inline-block; width: .5em; height: .5em; margin-right: .5em;
  background: var(--accent); vertical-align: .08em;
}
.theme-alasilacx .dash-nav button.on,
.theme-alasilacx .tab.on,
.theme-alasilacx .chip.on {
  background: linear-gradient(90deg, var(--brand-hi), var(--brand-lo));
  border-color: var(--brand-hi); color: #fff;
}
.theme-alasilacx .dash-nav button.on:hover { color: #fff; }
.theme-alasilacx .ins-bar .fill { background: linear-gradient(90deg, var(--brand-lo), var(--accent)); }
.theme-alasilacx .insights { background: linear-gradient(180deg, #1a1736, #17142f); border-top: 2px solid var(--brand-lo); }
.theme-alasilacx .detail-card { border-top-width: 4px; }
.theme-alasilacx .pill.total { --c: var(--accent); }

/* ---------------------------------------------------------------- reports overlay */
.hdr-btn {
  flex: 0 0 auto; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  padding: .35rem .8rem; border-radius: 6px; color: var(--text);
  background: var(--panel-2); border: 1px solid var(--border);
}
.hdr-btn:hover { border-color: var(--accent); }
.theme-alasilacx .hdr-btn { border-color: var(--brand-hi); }
.reports {
  position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
  background: rgba(0, 0, 0, .7); padding: 1.5vh 1.5vw;
}
.reports[hidden] { display: none; }
.reports-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .5rem .8rem; background: var(--panel); border: 1px solid var(--border); border-bottom: 0;
  border-radius: 10px 10px 0 0; font-weight: 600;
}
.theme-alasilacx .reports-bar { background: linear-gradient(90deg, #8b86b8, #554d93); color: #fff; border: 0; }
.reports iframe { flex: 1 1 auto; width: 100%; border: 0; background: #f2f3f7; border-radius: 0 0 10px 10px; }

</style>
</head>

/*
 * NOC dashboard layout config - edit this file, no code changes needed.
 *
 * sections: rendered top-to-bottom in this order (think: traffic path,
 * Internet -> Firewall -> Core -> Access -> Servers).
 * A device goes into the FIRST section it matches:
 *   tags    - PRTG tags on the device (exact, case-insensitive)
 *   groups  - regex tested against the device's PRTG group name
 *   devices - regex tested against the device name
 *
 * Devices that match nothing go into a section named after their PRTG group
 * (unmatched: 'group') or into one "Other" section (unmatched: 'other').
 */
window.NOC_CONFIG = {
  // =====================================================================
  //  PASTE YOUR PRTG LOGIN DETAILS HERE  (use a READ-ONLY PRTG user)
  //  Option A: API key  ->  apiToken: 'xxxxxxxx',
  //  Option B: user + passhash  ->  username: 'noc-screen', passhash: '1234567890',
  //  Anyone who can open this page can read these values in the source.
  // =====================================================================
  apiToken: '',
  username: '',
  passhash: '',
  // =====================================================================

  source: 'prtg',  // single-file mode: read the PRTG API directly

  title: 'NOC Dashboard',
  subtitle: 'PRTG live status',

  refreshSeconds: 30,       // how often the screen polls the backend
  staleAfterSeconds: 120,   // after this with no good update, screen goes "STALE"
  reloadPageHours: 6,       // full page reload every N hours (picks up a replaced file); 0 = never

  sections: [
    { title: 'WAN / Internet',        tags: ['noc-wan'],    groups: ['wan', 'internet', 'isp', 'circuit'] },
    { title: 'Firewalls',             tags: ['noc-fw'],     groups: ['firewall', 'fortigate', 'fgt'] },
    { title: 'Core',                  tags: ['noc-core'],   groups: ['core'] },
    { title: 'Distribution / Access', tags: ['noc-access'], groups: ['distribution', 'access', 'switch'] },
    { title: 'Servers',               tags: ['noc-server'], groups: ['server', 'domain', 'dc\\b'] },
    { title: 'Branches',              tags: ['noc-branch'], groups: ['branch', 'site'] },
  ],
  unmatched: 'group',

  excludeGroups: [],         // regex list, e.g. ['^Lab', 'Test']
  hidePausedDevices: false,  // hide devices that are fully paused
  sortDevices: 'name',       // 'name' keeps tiles in fixed positions; 'severity' floats problems to the front
  showHost: true,            // show device IP/hostname on tiles
  maxProblemsPerTile: 3,     // problem sensors listed inside each tile

  // ---- Show ONLY selected sensors/devices (like your old map) -------------
  // Put PRTG object IDs here (sensor IDs or device IDs - a device ID shows all
  // its sensors). Find an ID in the PRTG URL: .../sensor.htm?id=2045 -> 2045
  // Leave both empty to show everything the PRTG user can see.
  onlyIds: [],
  onlyTags: [],              // or: tag the sensors in PRTG (e.g. 'noc') and list the tag here
  showAllSensors: 'auto',    // list every selected sensor with its value ('auto' = when filtering)
  maxSensorsPerTile: 8,

  alertStatuses: ['down', 'warn', 'unusual', 'ack'], // what counts as an alert in the right panel
};

      });

  dev('Branches', 'BR-Dammam', '10.21.0.1', [

  <script>
(function () {
  'use strict';

  var CFG = Object.assign({
    title: 'NOC Dashboard',
    subtitle: 'PRTG live status',
    refreshSeconds: 30,
    staleAfterSeconds: 120,
    reloadPageHours: 6,
    fitToScreen: 'auto', // grow text to fill the screen: true / false / 'auto' (= on for panels layout)
    fitMaxFontPx: 48,    // upper limit for fit-to-screen text size
    panelColumns: 0,     // panels per row; 0 = all panels in one row
    detailAutoCloseSeconds: 120, // graph panel closes itself after this long without interaction (0 = never)
    sections: [],
    panels: [],   // map-style layout: [{ title, items: [{ device, sensor, label }] }] - overrides sections
    unmatched: 'group',
    excludeGroups: [],
    hidePausedDevices: false,
    sortDevices: 'name',
    showHost: true,
    maxProblemsPerTile: 3,
    onlyIds: [],          // PRTG object IDs (sensors or devices) to show; empty = everything
    onlyTags: [],         // PRTG tags (on sensor or device) to show; empty = everything
    showAllSensors: 'auto', // list every sensor + value in tiles; 'auto' = on when a filter is set
    maxSensorsPerTile: 8,
    maxAlerts: 50,
    alertStatuses: ['down', 'warn', 'unusual', 'ack'],
    source: 'backend', // 'backend' = Node server (/api/state); 'prtg' = call PRTG API directly
    prtgBase: '',      // direct mode: '' = same origin as the page (file inside PRTG webroot)
    apiToken: '',      // direct mode: PRTG API key (read-only user). Empty = use logged-in session
    username: '',      // direct mode alternative to apiToken: PRTG username ...
    passhash: '',      // ... + that user's passhash
  }, window.NOC_CONFIG || {});

  var params = new URLSearchParams(location.search);
  var DEMO = params.has('demo');

  // Small localStorage wrapper: per-browser UI state; never required to work.
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
  };

  // ---- views (presets): one page, several dashboards - NOC / VoIP / ... ----
  // Site files register them with (window.NOC_PRESETS ||= []).push({ key, label, ...config }).
  var PRESETS = window.NOC_PRESETS || [];
  var BASE = JSON.parse(JSON.stringify(CFG));
  var view = null;
  function applyPreset(key) {
    var p = PRESETS.filter(function (x) { return x.key === key; })[0] || PRESETS[0];
    if (!p) return;
    Object.keys(CFG).forEach(function (k) { if (!(k in BASE)) delete CFG[k]; });
    Object.keys(BASE).forEach(function (k) { CFG[k] = BASE[k]; });
    Object.keys(p).forEach(function (k) { CFG[k] = p[k]; });
    view = p.key;
  }
  applyPreset(params.get('view') || store.get('noc-view', null));
  if (params.has('kiosk')) document.body.classList.add('kiosk');

  // PRTG status_raw -> [css class, label]
  var STATUS = {
    1: ['unknown', 'Unknown'],
    2: ['unknown', 'Scanning'],
    3: ['up', 'Up'],
    4: ['warn', 'Warning'],
    5: ['down', 'Down'],
    6: ['unknown', 'No Probe'],
    7: ['paused', 'Paused'],
    8: ['paused', 'Paused (dependency)'],
    9: ['paused', 'Paused (schedule)'],
    10: ['unusual', 'Unusual'],
    11: ['unknown', 'Not Licensed'],
    12: ['paused', 'Paused (until)'],
    13: ['ack', 'Down (Ack)'],
    14: ['down', 'Partial Down'],
  };
  var RANK = { down: 0, warn: 1, unusual: 2, ack: 3, unknown: 4, paused: 5, up: 6 };

  var SUMMARY = [
    ['down', 'Down'],
    ['warn', 'Warning'],
    ['unusual', 'Unusual'],
    ['ack', 'Ack'],
    ['paused', 'Paused'],
    ['up', 'Up'],
  ];

  function cls(code) { return (STATUS[code] || STATUS[1])[0]; }
  function label(code) { return (STATUS[code] || STATUS[1])[1]; }

  var compiled = (CFG.sections || []).map(function (s) {
    return {
      title: s.title,
      tags: (s.tags || []).map(function (t) { return String(t).toLowerCase(); }),
      groups: (s.groups || []).map(function (g) { return new RegExp(g, 'i'); }),
      devices: (s.devices || []).map(function (d) { return new RegExp(d, 'i'); }),
    };
  });
  var excluded = (CFG.excludeGroups || []).map(function (g) { return new RegExp(g, 'i'); });
  var onlyIds = {};
  (CFG.onlyIds || []).forEach(function (i) { onlyIds[Number(i)] = true; });
  var onlyTags = (CFG.onlyTags || []).map(function (t) { return String(t).toLowerCase(); });
  var FILTERED = Object.keys(onlyIds).length > 0 || onlyTags.length > 0;
  var SHOW_ALL = CFG.showAllSensors === 'auto' ? FILTERED : Boolean(CFG.showAllSensors);

  function hasTag(list) {
    return list.some(function (t) { return onlyTags.indexOf(String(t).toLowerCase()) >= 0; });
  }

  var state = {
    data: null,
    lastOkAt: 0,
    lastError: '',
    knownAlerts: null, // Set of alert sensor ids from previous render
  };

  // ------------------------------------------------------------------ DOM utils
  function $(id) { return document.getElementById(id); }

  function el(tag, className, text) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (text != null) n.textContent = text;
    return n;
  }

  // ------------------------------------------------------------------ data
  // ---- direct PRTG mode (single-file install inside PRTG's webroot) --------
  // Same-origin calls to /api/table.json ride on the viewer's PRTG login
  // session, so no credentials need to live in the page.
  var DEVICE_COLS = 'objid,group,device,host,status,tags,priority';
  var SENSOR_COLS = 'objid,parentid,group,device,sensor,status,message,lastvalue,priority,tags,downtimesince';

  function authQuery() {
    if (CFG.apiToken) return '&apitoken=' + encodeURIComponent(CFG.apiToken);
    if (CFG.username && CFG.passhash) {
      return '&username=' + encodeURIComponent(CFG.username) + '&passhash=' + encodeURIComponent(CFG.passhash);
    }
    return '';
  }

  function prtgTable(content, columns, signal, extra) {
    var url = (CFG.prtgBase || '') + '/api/table.json?content=' + content +
      '&output=json&count=50000&columns=' + columns + (extra || '') + authQuery();
    // Send the same request headers PRTG's own web UI (jQuery) sends.
    var headers = { 'X-Requested-With': 'XMLHttpRequest', Accept: 'application/json' };
    var csrf = document.querySelector('meta[name="csrf-token"]');
    if (csrf && csrf.content) headers['X-CSRF-Token'] = csrf.content;
    return fetch(url, { cache: 'no-store', credentials: 'same-origin', headers: headers, signal: signal })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('PRTG refused the request (HTTP ' + r.status + ') - ' + (CFG.apiToken || CFG.passhash ? 'PRTG rejected the key/passhash in the file - check it was pasted correctly' : 'log in to PRTG on this exact address, or set apiToken'));
        if (!r.ok) throw new Error('PRTG returned HTTP ' + r.status);
        return r.json().catch(function () {
          throw new Error('PRTG session expired or returned a login page - log in and reload');
        });
      });
  }

  // DOMParser builds an inert document (no script execution, no image loads)
  var parser = new DOMParser();
  function strip(s) {
    var str = String(s == null ? '' : s);
    if (str.indexOf('<') < 0 && str.indexOf('&') < 0) return str.trim();
    return (parser.parseFromString(str, 'text/html').body.textContent || '').trim();
  }
  function n(v, f) { var x = Number(v); return isFinite(x) ? x : f; }
  function tagList(t) { return String(t || '').split(/[\s,]+/).filter(Boolean); }

  var PANEL_TAGS = [];
  [].concat(CFG.panels || [], PRESETS.reduce(function (a, p) { return a.concat(p.panels || []); }, [])).forEach(function (p) {
    (p.items || []).forEach(function (it) {
      if (it.tag && PANEL_TAGS.indexOf(String(it.tag).toLowerCase()) < 0) PANEL_TAGS.push(String(it.tag).toLowerCase());
    });
  });

  function fetchDirect(signal) {
    var tagReqs = PANEL_TAGS.map(function (t) {
      return prtgTable('sensors', 'objid', signal, '&filter_tags=' + encodeURIComponent('@tag(' + t + ')'))
        .then(function (r) { return [t, (r.sensors || []).map(function (s) { return Number(s.objid); })]; })
        .catch(function () { return [t, null]; });
    });
    return Promise.all([
      prtgTable('devices', DEVICE_COLS, signal),
      prtgTable('sensors', SENSOR_COLS, signal),
      Promise.all(tagReqs),
    ]).then(function (res) {
      var tagIds = {};
      res[2].forEach(function (pair) { if (pair[1]) tagIds[pair[0]] = pair[1]; });
      return {
        ok: true,
        tagIds: tagIds,
        devices: (res[0].devices || []).map(function (d) {
          return {
            id: n(d.objid, 0), name: strip(d.device), group: strip(d.group), host: strip(d.host),
            status: n(d.status_raw, 1), tags: tagList(d.tags), priority: n(d.priority_raw, n(d.priority, 3)),
          };
        }),
        sensors: (res[1].sensors || []).map(function (s) {
          return {
            id: n(s.objid, 0), deviceId: n(s.parentid, 0), device: strip(s.device), group: strip(s.group),
            name: strip(s.sensor), status: n(s.status_raw, 1),
            message: strip(s.message_raw != null ? s.message_raw : s.message),
            lastValue: strip(s.lastvalue), priority: n(s.priority_raw, n(s.priority, 3)),
            tags: tagList(s.tags), downSince: strip(s.downtimesince),
          };
        }),
      };
    });
  }

  function fetchState() {
    if (DEMO) return Promise.resolve(window.NOC_DEMO());

    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, 25000);

    if (CFG.source === 'prtg') {
      return fetchDirect(ctrl.signal).finally(function () { clearTimeout(t); });
    }

    return fetch('api/state', { cache: 'no-store', signal: ctrl.signal })
      .then(function (r) {
        return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; });

      .then(function (j) {

      })
      .finally(function () { clearTimeout(t); });

  function sectionFor(dev) {
    var tags = dev.tags.map(function (t) { return t.toLowerCase(); });
    for (var i = 0; i < compiled.length; i++) {
      var s = compiled[i];
      if (s.tags.some(function (t) { return tags.indexOf(t) >= 0; })) return s.title;
      if (s.groups.some(function (re) { return re.test(dev.group); })) return s.title;
      if (s.devices.some(function (re) { return re.test(dev.name); })) return s.title;
    }
    return CFG.unmatched === 'group' ? (dev.group || 'Ungrouped') : 'Other';
  }

  function model(data) {
    var sensorsByDevice = {};
    var totals = { down: 0, warn: 0, unusual: 0, ack: 0, paused: 0, up: 0, unknown: 0, all: 0 };

    var devices = data.devices.filter(function (d) {
      return !excluded.some(function (re) { return re.test(d.group); });
    });
    var deviceIds = {};
    devices.forEach(function (d) { deviceIds[d.id] = true; });

    var devById = {};
    devices.forEach(function (d) { devById[d.id] = d; });

    var sensors = data.sensors.filter(function (s) {
      if (!deviceIds[s.deviceId]) return false;
      if (!FILTERED) return true;
      var d = devById[s.deviceId];
      return onlyIds[s.id] || onlyIds[s.deviceId] || hasTag(s.tags) || hasTag(d.tags);
    });

    if (FILTERED) {
      // keep only devices that are selected themselves or have a selected sensor
      var keep = {};
      sensors.forEach(function (s) { keep[s.deviceId] = true; });
      devices = devices.filter(function (d) { return keep[d.id] || onlyIds[d.id] || hasTag(d.tags); });
    }
    sensors.forEach(function (s) {
      var c = cls(s.status);
      totals[c] += 1;
      totals.all += 1;
      (sensorsByDevice[s.deviceId] = sensorsByDevice[s.deviceId] || []).push(s);
    });

    var sections = {};
    devices.forEach(function (d) {
      d.sensors = (sensorsByDevice[d.id] || []).slice().sort(bySeverity);
      d.counts = {};
      d.sensors.forEach(function (s) { var c = cls(s.status); d.counts[c] = (d.counts[c] || 0) + 1; });
      if (CFG.hidePausedDevices && cls(d.status) === 'paused') return;
      var title = sectionFor(d);
      (sections[title] = sections[title] || []).push(d);
    });

    var order = compiled.map(function (s) { return s.title; });
    var titles = Object.keys(sections).sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia < 0) ia = 1e6;
      if (ib < 0) ib = 1e6;
      return ia - ib || a.localeCompare(b);
    });

    var alerts = sensors
      .filter(function (s) { return CFG.alertStatuses.indexOf(cls(s.status)) >= 0; })
      .sort(bySeverity);

    return {

      sections: titles.map(function (t) {
        var list = sections[t].slice().sort(CFG.sortDevices === 'severity' ? devBySeverity : byName);
        var worst = list.reduce(function (w, d) { return Math.min(w, RANK[cls(d.status)]); }, 6);

      }),

  function bySeverity(a, b) {
    return RANK[cls(a.status)] - RANK[cls(b.status)] ||
      (b.priority || 0) - (a.priority || 0) ||
      String(a.device).localeCompare(String(b.device)) ||
      String(a.name).localeCompare(String(b.name));
  }
  function devBySeverity(a, b) {
    return RANK[cls(a.status)] - RANK[cls(b.status)] || byName(a, b);
  }
  function byName(a, b) {
    return String(a.name).localeCompare(String(b.name), undefined, { numeric: true });
  }

  // ------------------------------------------------------------------ render
  function renderSummary(m) {
    var box = $('summary');
    box.textContent = '';
    SUMMARY.forEach(function (p) {
      var n = m.totals[p[0]] || 0;
      var pill = el('div', 'pill s-' + p[0] + (n === 0 && p[0] !== 'up' ? ' zero' : ''));
      pill.appendChild(el('span', 'n', String(n)));
      pill.appendChild(el('span', 'l', p[1]));
      box.appendChild(pill);
    });
    var tot = el('div', 'pill total');
    tot.appendChild(el('span', 'n', String(m.totals.all)));
    tot.appendChild(el('span', 'l', 'Sensors / ' + m.deviceCount + ' dev'));
    box.appendChild(tot);
  }

  // ------------------------------------------------------------------ map-style panels
  // Names are compared ignoring case and ALL whitespace, so "(065) ALULA -office-2"
  // matches "(065) ALULA - office-2". Wrap a value in /.../ to use a regex instead.
  function squash(x) { return String(x == null ? '' : x).replace(/\s+/g, '').toLowerCase(); }
  function textMatcher(pattern, exact) {
    var p = String(pattern);
    if (p.length > 2 && p[0] === '/' && p[p.length - 1] === '/') {
      var re = new RegExp(p.slice(1, -1), 'i');
      return function (v) { return re.test(String(v)); };
    }
    var want = squash(p);
    return exact
      ? function (v) { return squash(v) === want; }
      : function (v) { return squash(v).indexOf(want) >= 0; };
  }

  // Items: { id }, { device }, { sensor [, device] }, { tag }; add expand: true
  // to list every sensor of the matched device(s) as its own row.
  function resolveItem(item, m) {
    var hits = resolveBase(item, m);
    if (!item.expand) return hits;
    var out = [];
    hits.forEach(function (h) {
      if (h.kind !== 'device') { out.push(h); return; }
      m.sensors
        .filter(function (s) { return s.deviceId === h.obj.id; })
        .sort(function (a, b) { return byName(a, b); })
        .forEach(function (s) { out.push({ kind: 'sensor', obj: s }); });
    });
    return out;
  }

  function resolveBase(item, m) {
    if (item.tag) {
      // PRTG's own tag filter (includes tags inherited from device/group); falls
      // back to the sensor's and device's own tags.
      var t = String(item.tag).toLowerCase();
      var fromPrtg = (state.data && state.data.tagIds && state.data.tagIds[t]) || null;
      var devTagged = {};
      m.devices.forEach(function (d) {
        if (d.tags.some(function (x) { return x.toLowerCase() === t; })) devTagged[d.id] = true;
      });
      return m.sensors
        .filter(function (s) {
          return (fromPrtg && fromPrtg.indexOf(s.id) >= 0) || devTagged[s.deviceId] ||
            s.tags.some(function (x) { return x.toLowerCase() === t; });
        })
        .sort(function (a, b) { return a.device.localeCompare(b.device) || byName(a, b); })
        .map(function (s) { return { kind: 'sensor', obj: s }; });
    }
    if (item.id != null) {
      // PRTG object ID: matches a sensor or a device (IDs are unique across PRTG)
      var id = Number(item.id);
      var sensor = m.sensors.filter(function (x) { return x.id === id; })[0];
      if (sensor) return [{ kind: 'sensor', obj: sensor }];
      var dev = m.devices.filter(function (x) { return x.id === id; })[0];
      return dev ? [{ kind: 'device', obj: dev }] : [];
    }
    var dm = item.device ? textMatcher(item.device, false) : null;
    if (item.sensor) {
      var sm = textMatcher(item.sensor, true);
      return m.sensors
        .filter(function (s) { return sm(s.name) && (!dm || dm(s.device)); })
        .map(function (s) { return { kind: 'sensor', obj: s }; });
